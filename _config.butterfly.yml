# ===== 导航栏 =====
nav:
  logo: /img/Avatar.jpg
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  时间轴: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  清单||fa fa-heartbeat:
    音乐: /music/ || fas fa-music
    摄影: /Gallery/ || fas fa-images
    番剧: /movies/ || fas fa-video
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart
  简历: /resume/ || fas fa-file-alt

# ===== 代码块 =====
code_blocks:
  theme: darker
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false

# ===== 社交链接 =====
social:
  fab fa-github-square: https://github.com/BOHUYESHAN-APB || Github博客仓库 || '#525252'
  fab fa-github: https://github.com/BoHuYeShan || Github个人仓库 || '#24292e'
  fab fa-bilibili: https://space.bilibili.com/316318805 || bilibili个人主页 || '#FB7299'

# ===== 图片 =====
favicon: /img/favicon.ico
avatar:
  img: /img/Avatar.jpg
  effect: false
disable_top_img: false
index_img: /img/banner/home-img.jpg
default_top_img: /img/banner/home-img.jpg
archive_img: /img/banner/home-img.jpg
footer_img: false

# ===== 文章封面 =====
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both

# ===== 错误页 =====
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg
error_404:
  enable: true
  subtitle: 'Page Not Found'
  background: /img/error-page.png

# ===== 文章元数据 =====
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# ===== 首页 =====
index_layout: 3
index_post_content:
  method: 3
  length: 500

# ===== 目录 =====
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# ===== 版权 =====
post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# ===== 相关文章 =====
related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

# ===== 过期提醒 =====
noticeOutdate:
  enable: true
  style: flat
  limit_day: 500
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# ===== 页脚 =====
footer:
  owner:
    enable: true
    since: 2020
  copyright:
    enable: true
    version: true
  custom_text:

# ===== 副标题 =====
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - Per Aspera Ad Astra
    - 愿此行终抵群星

# ===== 侧边栏 =====
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-bilibili
      text: 去哔哩哔哩找到我！
      link: https://space.bilibili.com/316318805
  card_announcement:
    enable: true
    content: 这是一个公告！
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 8/8/2020 00:00:00

# ===== 字数和阅读时间 =====
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# ===== 统计 =====
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# ===== 右下角按钮 =====
rightside_bottom:
rightside_scroll_percent: false
rightside_config_animation: true

# ===== 暗色模式 =====
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# ===== 阅读模式 =====
readmode: true

# ===== 搜索 =====
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: true

# ===== 分享 =====
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq

# ===== 亮色盒 =====
lightbox: fancybox

# ===== 标签外挂 =====
series:
  enable: true
  orderBy: 'title'
  order: 1
  number: true

# ===== Note =====
note:
  style: flat
  icons: true
  border_radius: 3
  light_bg_offset: 0

# ===== 效果 =====
fireworks:
  enable: true
  zIndex: 9999
  mobile: false

display_mode: light
enter_transitions: true

# ===== 加载动画 =====
preloader:
  enable: true
  source: 1

# ===== Open Graph =====
Open_Graph_meta:
  enable: true

# ===== CDN =====
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true

# ===== 自定义注入 =====
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">

# ===== 数学公式 =====
math:
  use: katex
  per_page: false
