
# Navigation bar settings (導航欄設置)
# see https://butterfly.js.org/posts/4aa8abbe/##導航欄設置-Navigation-bar-settings
# --------------------------------------

nav: 
  logo: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg
  display_title: true
  fixed: false # fixed navigation bar

# Menu 目錄
menu:
  首页: / || fas fa-home
  时间轴: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  清单||fa fa-heartbeat:
    音乐: /music/ || fas fa-music
    照片: /Gallery/ || fas fa-images
    影视: /movies/ || fas fa-video
    书单: /books/ || fas fa-book
    说说: /say/ || fas fa-comments 
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

# Code Blocks (代碼相關)
# --------------------------------------

highlight_theme: darker #  darker / pale night / light / ocean / mac / mac light / false
highlight_copy: true # copy button
highlight_lang: true # show the code language
highlight_shrink: false # true: shrink the code blocks / false: expand the code blocks | none: expand code blocks and hide the button
highlight_height_limit: false # unit: px
code_word_wrap: false

# Social Settings (社交圖標設置)
# formal:
#   icon: link || the description || color
social:
  fab fa-github-square: https://github.com/BOHUYESHAN-APB || Github博客仓库 || '#525252'
  fab fa-github: https://github.com/BoHuYeShan || Github个人仓库 || '#24292e'
  fab fa-bilibili: https://space.bilibili.com/316318805 || bilibili个人主页 || '#FB7299'
  
# Image (圖片設置)
# --------------------------------------

# Favicon（網站圖標）
favicon: /img/favicon.png

# Avatar (頭像)
avatar:
  img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg
  effect: false # true: small to large on hover

# Disable all banner image
# disable_top_img: false

# The banner image of home page
index_img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# If the banner of page not setting, it will show the top_img
# default_top_img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# The banner image of archive page
# archive_img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# If the banner of tag page not setting, it will show the top_img
# tag_img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# The banner image of tag page
# tag_per_img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# If the banner of category page not setting, it will show the top_img
# category_img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# The banner image of category page
# category_per_img: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

cover:
  # display the cover or not (是否顯示cover)
  enable: true
  # the position of cover to show (cover顯示的位置)
  # left: left on the post (文章左側)
  # right: right on the post (文章右側)
  # both: both left and right (兩側都顯示)
  position: both
  # When cover is not set, the default cover is displayed (當沒有設置cover時，默認的cover)
  default_cover:
    # - https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# Replace Broken Images (替換無法顯示的圖片)
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg
  tag_page: /img/404.jpg
  category_page: /img/404.jpg
  archive_page: /img/404.jpg
  404: /img/404.jpg

# A simple 404 page
error_404:
  enable: true
  subtitle: '页面未找到'
  background: https://s2.loli.net/2024/09/21/xdWqH5JRsYzvGAC.jpg

# post
# --------------------------------------

# toc (目錄)
toc:
  enable: true
  number: true
  style_simple: false # for post
  scroll_percent: true
  auto_open: true # auto open the sidebar

# post_copyright (版權)
post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Post settings
# --------------------------------------
# Advertisement
google_adsense:
  enable: false
  auto_ads: false
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

# Insert ads manually (手動插入廣告)
# ad:
#   index:
#   aside:
#   post:
#   - class_name: sticky
#     position: 1
#   - class_name: sticky
#     position: 2

# site_verification (站長驗證)
site_verification:
  # - name: google-site-verification
  #   content: xxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxx

# Beautify/Effect (美化/效果)
# --------------------------------------

# Theme color for customize (主題色)
# Notice: color value must in double quotes like "#000" or may cause error!
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_theme_color_light: "#ffffff"
  meta_theme_color_dark: "#0d0d0d"

# Footer Background
footer_bg: true

# Mouse click effects: fireworks (鼠標點擊效果: 煙火)
fireworks:
  enable: false
  zIndex: 9999 # -1 or 9999
  mobile: false

# Mouse click effects: Heart symbol (鼠標點擊效果: 愛心)
click_heart:
  enable: false
  mobile: false

# Mouse click effects: words (鼠標點擊效果: 文字)
click_show_text:
  enable: false
  text:
    # - I
    # - LOVE
    # - YOU
  font_size: 15px
  random: false

# Default display mode (默認顯示模式)
# light (default) / dark / auto (follow system)
display_mode: light

# Beautify (美化)
beautify:
  enable: true
  field: post # site/post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#F47466'

# Global font settings
# Don't modify the following settings unless you know how they work (非必要不要修改)
# 全局字體設置
# 字體優先使用順序：'自定義字體', '系統字體', 'Microsoft YaHei'
# 自定義字體會自動載入，系統字體無需載入
font:
  global-font-size:
  code-font-size:
  font-family:
  code-font-family:

# Font settings for the site title and site subtitle
# 針對網站標題和網站副標題的字體設置
blog_title_font:
  font_link:
  font-family:

# Font settings for the article title
# 針對文章標題的字體設置
post_title_font:
  font_link:
  font-family:

# Font settings for the article content
# 針對文章內容的字體設置
post_content_font:
  font_link:
  font-family:

# Font settings for the site subtitle
# 針對網站副標題的字體設置
site_subtitle_font:
  font_link:
  font-family:

# Font settings for the navigation bar
# 針對導航欄的字體設置
nav_font:
  font_link:
  font-family:

# Font settings for the code
# 針對代碼的字體設置
code_font:
  font_link:
  font-family:

# The setting of code copy (代碼複製)
# --------------------------------------
# copyright: Add the copyright information after copied content (複製的內容後面加上版權信息)
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 50

# Open graph meta tags (社交卡片)
# https://developers.facebook.com/docs/sharing/webmasters/
open_graph:
  enable: true
  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# Add the vendor prefixes to ensure compatibility (添加供應商前綴)
# Don't modify the following settings unless you know how they work (非必要不要修改)
# 非必要請不要修改
prefix:
  avatar: /img/
  link: /img/
  cover: /img/
  # - /img/
  # - /img/

# Math (數學)
# --------------------------------------
# About the per_page
# if you set it to true, it will load mathjax/katex script in each page (true 表示每一頁都加載js)
# if you set it to false, it will load mathjax/katex script in the page that has 'mathjax: true' or 'katex: true' (default)
# if you set it to false, and you want to use mathjax/katex, you need to add 'mathjax: true' or 'katex: true' in the front-matter
# --------------------------------------

# MathJax
mathjax:
  enable: false
  per_page: false
  cdn:

# KaTeX
katex:
  enable: false
  per_page: false
  hide_scrollbar: true
  cdn:
  copy:
    enable: false
    show_button: false

# Search (搜索)
# --------------------------------------

# Algolia search
algolia_search:
  enable: false
  hits:
    per_page: 6
  labels:
    input_placeholder: Search for Posts
    hits_empty: 'We did not find any results for the search: ${query}'
    hits_stats: '${hits} results found in ${time} ms'

# Local search
local_search:
  enable: false
  preload: false
  CDN:
  # Local search files
  # If you set the CDN, the files will be loaded from the CDN
  # local_search: /js/search/local-search.js
  # Local search config
  # If you don't set the CDN, the files will be loaded from the local
  # local_search_config: /js/search/config.js

# Docsearch
# https://docsearch.algolia.com/
docsearch:
  enable: false
  # apiKey:
  # indexName:
  # appId:
  # option:

# Comments (評論)
# --------------------------------------
# There are 3 ways to use comments in the theme
# 1. Set comments to true (開啟評論)
# 2. Set use to a specific comment system (使用特定評論系統)
# 3. Set use to an array of comment systems (使用多個評論系統)
# --------------------------------------

comments:
  # Up to two comments system, the first will be shown as default
  # Choose: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  use: # Valine,Disqus
  text: true # Display the comment name next to the button
  # lazyload: The comment system will be load when comment element enters the browser's viewport.
  # If you set it to true, the comments will be loaded when the comment element enters the browser's viewport
  lazyload: false
  count: false # Display comment count in post's top_img
  card_post_count: false # Display comment count in Home Page

# disqus
# https://disqus.com/
disqus:
  shortname:

# Alternative Disqus - Render comments with Disqus API
# https://github.com/SukkaW/DisqusJS
disqusjs:
  shortname:
  apikey:
  option:

# Livere
# https://www.livere.com/
livere:
  uid:

# Gitalk
# https://gitalk.github.io/
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  language: zh-CN
  perPage: 10
  distractionFreeMode: false
  pagerDirection: last
  createIssueManually: false
  option:

# Valine
# https://valine.js.org/
valine:
  appId: # leancloud application app id
  appKey: # leancloud application app key
  pageSize: 10 # comment list page size
  lang: zh-CN
  placeholder: 请留下你的足迹 # valine comment input placeholder (like: 请留下你的足迹)
  avatar: mp # gravatar style https://valine.js.org/avatar
  meta: nick,mail,link # comment input meta (nick/mail/link)
  pageview: false # page view counter
  recordIP: false # Record commenter IP
  serverURLs: # This configuration is suitable for domestic custom domain name users, overseas version will be automatically detected (no need to manually fill in)
  bg: # valine background
  emojiCDN: # emoji CDN
  enableQQ: false # enable the Nickname box to automatically get QQ Nickname and QQ Avatar
  requiredFields: nick,mail # required fields (nick/mail/link)
  visitor: false
  option:

# waline - A simple comment system with backend support fork from Valine
# https://waline.js.org/
waline:
  serverURL: # Waline server address url
  bg: # waline background
  pageview: false
  option:

# utterances
# https://utteranc.es/
utterances:
  repo:
  # Issue Mapping: pathname/url/title/og:title
  issue_term: pathname
  # Theme: github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark

# Facebook Comments Plugin
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  app_id:
  user_id: # optional
  pageSize: 10 # The number of comments to show
  order_by: social # social/time/reverse_time
  lang: zh_TW # Language en_US/zh_CN/zh_TW and so on

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  envId:
  region:
  visitor: false
  option:

# Giscus
# https://giscus.app/
giscus:
  repo:
  repo_id:
  category_id:
  mapping: pathname
  input_position: top
  lang: zh-CN
  reactions_enabled: 1
  emit_metadata: 0
  crossorigin: anonymous

# Remark42
# https://remark42.com/
remark42:
  host: # Your host url
  site_id: # Your site id
  option:

# Artalk
# https://artalk.js.org/
artalk:
  server:
  site:
  option:

# --------------------------------------
# Right side bottom button (右下角按鈕)
# --------------------------------------

# Change font size
change_font_size:
  enable: false

# Conversion between Traditional and Simplified Chinese (簡繁轉換)
translate:
  enable: false
  # The text of a button
  default: 繁
  # the language of website (1: Traditional Chinese/2: Simplified Chinese)
  defaultEncoding: 2
  # Time delay
  translateDelay: 0
  # The text of the button when the language is Simplified Chinese
  msgToTraditionalChinese: '繁'
  # The text of the button when the language is Traditional Chinese
  msgToSimplifiedChinese: '簡'

# Read Mode (閱讀模式)
readmode:
  enable: false

# Reading progress bar (閱讀進度條)
reading_progress:
  enable: false
  # Available values: left | top | right
  start: top
  # Available values: vertical | horizontal
  direction: horizontal
  # If set true, then it will be fixed at the top of the page
  fixed: false
  # Color
  color: '#37c6c0'
  # Height (in px)
  height: 3
  # Opacity (0-1)
  opacity: 0.8

# Auto scroll to the comment area (自動跳轉到評論區)
comments_scroll:
  enable: false

# Auto open sidebar (自動打開側邊欄)
auto_open_sidebar:
  enable: false

# Anchor scroll through the navigation menu (錨點滾動)
anchor_nav:
  enable: false
  offset: 0
  showPercent: false

# --------------------------------------
# Tags Settings (標籤設置)
# --------------------------------------

# Tags Cloud 標籤雲
tagcloud:
  enable: false
  min_font: 0.8
  max_font: 1.5
  unit: rem
  start_color: '#999'
  end_color: '#99F'
  threshold: 0

# Tag plugins (標籤外掛)
# --------------------------------------

# Note (Bootstrap Callout)
note:
  # Note tag style values:
  #  - simple    bs-callout old alert style. Default.
  #  - modern    bs-callout new (AdminLTE) style
  #  - flat      flat callout style with background, like on NeilOrangePeel.com
  #  - disabled  disable all CSS styles import of note tag
  style: simple
  icons: false
  border_radius: 3
  # Offset lighter of background in % for modern and flat styles (modern: -12 | 12; flat: -18 | 6).
  # Offset also applied to label tag variables. This option can work with disabled note tag.
  light_bg_offset: 0

# Button
btn:
  icon: true
  animation: false
  # Custom button color for button
  color: '#07c160'
  # Custom hover color for button
  hover_color: '#049f48'

# Mermaid
# see https://github.com/knsv/mermaid
mermaid:
  enable: false
  # built-in themes: default/forest/dark/neutral
  theme: default
  theme_variables: false
  # import mermaid.min.js
  cdn:
  # <script src="https://cdn.jsdelivr.net/npm/mermaid@8.13.4/dist/mermaid.min.js"></script>
  # <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mermaid@8.13.4/dist/mermaid.min.css">
  # Custom mermaid option
  option:
    # startOnLoad: true
    # theme: 'dark'

# Chart
# see https://www.chartjs.org/
chart:
  enable: false
  # import chart.js
  cdn:
  # <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>

# ABCJS
# see https://github.com/paulrosen/abcjs
abcjs:
  enable: false
  # import abcjs
  cdn:
  # <script src="https://cdn.jsdelivr.net/npm/abcjs@6.0.0-beta.21/dist/abcjs-basic-min.js"></script>

# Tags in the post (文章標籤)
# --------------------------------------

# Donate (打賞)
donate:
  enable: false
  # Donate images
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# Post copyright (文章版權)
post_copyright:
  enable: true
  decode: false
  author_href:
  location: 广东省广州市
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Post edit (文章編輯)
post_edit:
  enable: false
  url: https://github.com/xxx/xxx/tree/main/source/_posts/ # Link for viewing posts
  # For example: https://github.com/xxx/xxx/tree/main/source/_posts/
  # If your article is in the subdirectory, you need to fill in the subdirectory path
  # For example: https://github.com/xxx/xxx/tree/main/source/_posts/subdirectory/
  branch: main

# Related articles (相關文章)
related_post:
  enable: true
  filter: false
  date_type: created
  date_format: YYYY-MM-DD
  headline: 相关文章
  limit: 6

# Post pagination (文章分頁)
# Pagination by sub_post (按子文章分頁)
# If you want to show the pagination button in the post, you need to set the following
# sub_post:
#   - title: xxx
#     url: xxx
#     date: xxx
#   - title: xxx
#     url: xxx
#     date: xxx
# --------------------------------------

# Displays outdated notice for a post (文章過期提醒)
noticeOutdate:
  enable: false
  style: flat
  date_param: created
  limit_day: 500
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# --------------------------------------
# Pjax
# --------------------------------------

pjax:
  enable: false
  timeout: 10000
  cacheBust: false
  exclude:
    # - /xxx/
    # - /xxx/

# --------------------------------------
# Inject
# --------------------------------------

# Insert the code to head (before the '</head>' tag) and the bottom (before the '</body>' tag)
# 插入代码到头部 </head> 之前 和 底部 </body> 之前
inject:
  head:
    # - <link rel="stylesheet" href="/xxx.css">
  bottom:
    # - <script src="xxx"></script>

