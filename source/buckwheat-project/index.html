<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智荟荞缘 & 智耕未来：AI与互联网+赋能荞麦全产业链革新</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .hero-bg {
            position: relative;
            overflow: hidden;
        }
        .hero-bg::before,
        .hero-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease;
        }
        .hero-bg::before {
            background-image: linear-gradient(to right, rgba(0,0,0,0.5), rgba(0,0,0,0.3)), 
                             url('/buckwheat-project/img/home-pg (1).png');
            z-index: 1;
        }
        .hero-bg::after {
            background-image: linear-gradient(to right, rgba(0,0,0,0.5), rgba(0,0,0,0.3)), 
                             url('/buckwheat-project/img/home-pg (2).png');
            opacity: 0;
            z-index: 2;
        }
        .hero-bg.alternate::before {
            opacity: 0;
        }
        .hero-bg.alternate::after {
            opacity: 1;
        }
        .hero-content {
            position: relative;
            z-index: 3;
        }
        .section-title {
            @apply text-3xl font-bold text-center mb-4 text-emerald-700;
        }
        .section-subtitle {
            @apply text-center text-gray-600 mb-12 max-w-2xl mx-auto;
        }
        .feature-card {
            @apply bg-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300;
        }
        .feature-card:hover {
            transform: translateY(-5px);
        }
        .feature-icon {
            @apply w-12 h-12 text-emerald-500 mb-4;
        }
        .btn {
            @apply px-6 py-3 rounded-lg font-semibold transition-all duration-300;
            backdrop-filter: blur(4px);
        }
        .btn-primary {
            @apply bg-emerald-600 text-white hover:bg-emerald-700;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-secondary {
            @apply bg-white bg-opacity-20 text-white hover:bg-opacity-30;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        /* 响应式优化 */
        @media (max-width: 640px) {
            .hero-bg {
                padding-top: 6rem;
                padding-bottom: 4rem;
            }
            .hero-content h1 {
                font-size: 2rem;
            }
            .hero-content p {
                font-size: 1.1rem;
            }
            .btn {
                padding: 0.75rem 1.5rem;
                font-size: 0.95rem;
            }
            .feature-card {
                margin-bottom: 1.5rem;
            }
        }

        /* 平板设备优化 */
        @media (min-width: 641px) and (max-width: 1024px) {
            .hero-bg {
                padding-top: 8rem;
                padding-bottom: 6rem;
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .feature-card {
                margin-bottom: 2rem;
            }
        }

        /* 大屏幕优化 */
        @media (min-width: 1025px) {
            .hero-bg {
                min-height: 80vh;
            }
            .hero-content {
                padding-top: 12rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="/buckwheat-project/" class="text-2xl font-bold text-emerald-600">
                    智荟荞缘 & 智耕未来
                </a>
                <div class="hidden md:flex space-x-4">
                    <a href="/buckwheat-project/" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">首页</a>
                    <a href="/buckwheat-project/tech.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">技术展示</a>
                    <a href="/buckwheat-project/culture.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">文化传播</a>
                    <a href="/buckwheat-project/about.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">关于我们</a>
                </div>
                <!-- 移动端菜单按钮 -->
                <button class="md:hidden text-gray-500 hover:text-emerald-600 focus:outline-none" id="menuButton">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
            <!-- 移动端菜单 -->
            <div class="md:hidden hidden" id="mobileMenu">
                <div class="px-2 pt-2 pb-3 space-y-1">
                    <a href="/buckwheat-project/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">首页</a>
                    <a href="/buckwheat-project/tech.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">技术展示</a>
                    <a href="/buckwheat-project/culture.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">文化传播</a>
                    <a href="/buckwheat-project/about.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">关于我们</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero区域 -->
    <header class="hero-bg text-white pt-32 pb-20 md:pt-48 md:pb-32">
        <div class="hero-content max-w-4xl mx-auto text-center px-4">
            <h1 class="text-4xl md:text-6xl font-bold mb-6">
                智荟荞缘 & 智耕未来
            </h1>
            <p class="text-lg md:text-2xl mb-8">
                AI与互联网+赋能荞麦全产业链革新，打造智慧农业新模式
            </p>
            <div class="space-x-4">
                <a href="/buckwheat-project/tech.html" class="btn btn-primary">探索技术</a>
                <a href="/buckwheat-project/culture.html" class="btn btn-secondary">了解更多</a>
            </div>
        </div>
    </header>

    <!-- 保持主要内容不变 -->

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <p>&copy; <span id="current-year"></span> 智荟荞缘 & 智耕未来项目团队</p>
            <p class="text-sm text-gray-400 mt-2">云南农业大学创新创业项目</p>
        </div>
    </footer>

    <script>
        // 设置年份
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // 移动端菜单切换
        const menuButton = document.getElementById('menuButton');
        const mobileMenu = document.getElementById('mobileMenu');
        
        menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // 背景图片自动切换
        const heroBg = document.querySelector('.hero-bg');
        let isAlternate = false;

        function toggleBackground() {
            isAlternate = !isAlternate;
            if (isAlternate) {
                heroBg.classList.add('alternate');
            } else {
                heroBg.classList.remove('alternate');
            }
        }

        // 每5秒切换一次背景
        setInterval(toggleBackground, 5000);

        // 添加页面滚动时的渐入效果
        const fadeInElements = document.querySelectorAll('.feature-card, .section-title, .section-subtitle');
        
        const fadeInOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const fadeInObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                    observer.unobserve(entry.target);
                }
            });
        }, fadeInOptions);

        fadeInElements.forEach(element => {
            element.style.opacity = '0';
            element.style.transform = 'translateY(20px)';
            element.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            fadeInObserver.observe(element);
        });
    </script>
</body>
</html>
