<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智荟荞缘 & 智耕未来：AI与互联网+赋能荞麦全产业链革新</title>
    
    <!-- 引入基础样式 -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    
    <!-- 引入字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 特效库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.7.0/dist/vanilla-tilt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body class="theme-light">
    <!-- 主题切换按钮 -->
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
    </button>

    <!-- 3D背景画布 -->
    <canvas id="background-canvas"></canvas>

    <!-- 导航栏 -->
    <nav class="main-nav neumorphic">
        <div class="nav-content">
            <a href="#" class="logo">智荟荞缘</a>
            <div class="nav-links">
                <a href="#home">首页</a>
                <a href="#about">项目介绍</a>
                <a href="#ai-solutions">AI赋能</a>
                <a href="#products">产品服务</a>
                <a href="#contact">联系我们</a>
            </div>
            <button class="mobile-menu-btn" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- 首屏区域 -->
    <header id="home" class="hero-section">
        <div class="content-wrapper">
            <h1 class="glitch-text">智荟荞缘 & 智耕未来</h1>
            <p class="hero-subtitle">AI与互联网+赋能荞麦全产业链革新</p>
            <div class="cta-buttons">
                <a href="#ai-solutions" class="btn btn-primary neumorphic">探索AI技术</a>
                <a href="#products" class="btn btn-secondary neumorphic">了解更多</a>
            </div>
        </div>
        <div class="scroll-indicator">
            <div class="mouse"></div>
            <span>向下滚动</span>
        </div>
    </header>

    <!-- AI功能展示区 -->
    <section id="ai-solutions" class="ai-solutions">
        <h2 class="section-title">AI赋能解决方案</h2>
        <div class="solutions-grid">
            <div class="solution-card neumorphic" data-tilt data-tilt-max="5">
                <div class="card-content">
                    <h3>智能种子筛选</h3>
                    <p>运用计算机视觉技术，精准筛选优质荞麦种子</p>
                    <button class="demo-btn">查看演示</button>
                </div>
            </div>
            <!-- 其他AI功能卡片 -->
        </div>
    </section>

    <!-- 产品展示区 -->
    <section id="products" class="products-section">
        <h2 class="section-title">产品服务</h2>
        <div class="product-cards">
            <!-- 产品卡片 -->
        </div>
    </section>

    <!-- 联系我们 -->
    <section id="contact" class="contact-section neumorphic">
        <h2 class="section-title">联系我们</h2>
        <div class="contact-content">
            <!-- 联系表单 -->
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; <span id="current-year"></span> 智荟荞缘 & 智耕未来项目团队</p>
        </div>
    </footer>

    <!-- 自定义脚本 -->
    <script src="js/theme.js"></script>
    <script src="js/background.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
