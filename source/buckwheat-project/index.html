<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智荟荞缘 & 智耕未来：AI与互联网+赋能荞麦全产业链革新</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .hero-bg {
            background-image: linear-gradient(to right, rgba(0,0,0,0.6), rgba(0,0,0,0.3)), url('https://source.unsplash.com/1600x900/?buckwheat,field');
            background-size: cover;
            background-position: center;
        }
        .section-title {
            @apply text-3xl font-bold text-center mb-4 text-emerald-700;
        }
        .section-subtitle {
            @apply text-center text-gray-600 mb-12 max-w-2xl mx-auto;
        }
        .feature-card {
            @apply bg-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition-shadow duration-300;
        }
        .feature-icon {
            @apply w-12 h-12 text-emerald-500 mb-4;
        }
        .btn {
            @apply px-6 py-3 rounded-lg font-semibold transition-colors duration-300;
        }
        .btn-primary {
            @apply bg-emerald-600 text-white hover:bg-emerald-700;
        }
        .btn-secondary {
            @apply bg-gray-200 text-emerald-700 hover:bg-gray-300;
        }
        .ai-demo-panel {
            @apply bg-gray-50 p-6 rounded-lg shadow-md border border-gray-200;
        }
        .ai-result-placeholder {
            @apply mt-4 p-4 bg-emerald-50 text-emerald-700 rounded-md border border-emerald-200;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md fixed w-full z-50 top-0">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="#" class="text-2xl font-bold text-emerald-600">
                    智荟荞缘 & 智耕未来
                </a>
                <div class="hidden md:flex space-x-4">
                    <a href="#intro" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">首页</a>
                    <a href="#ai-tech" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">AI技术</a>
                    <a href="#application" class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-600">应用场景</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 首屏 -->
    <header id="intro" class="hero-bg text-white pt-32 pb-20 md:pt-48 md:pb-32">
        <div class="max-w-4xl mx-auto text-center px-4">
            <h1 class="text-4xl md:text-6xl font-bold mb-6">
                智能荞麦种植解决方案
            </h1>
            <p class="text-lg md:text-2xl mb-8">
                运用AI技术优化荞麦种植全过程，提供精准化、智能化的农业解决方案
            </p>
            <div class="space-x-4">
                <a href="#ai-tech" class="btn btn-primary">探索AI技术</a>
                <a href="#application" class="btn btn-secondary">了解应用场景</a>
            </div>
        </div>
    </header>

    <main>
        <!-- AI技术展示 -->
        <section id="ai-tech" class="py-16 md:py-24">
            <div class="max-w-5xl mx-auto px-4">
                <h2 class="section-title">AI技术赋能</h2>
                <p class="section-subtitle">
                    基于深度学习的智能识别与监测系统，为荞麦种植提供全程技术支持
                </p>
                
                <!-- 种子筛选演示 -->
                <div class="space-y-12">
                    <div class="ai-demo-panel">
                        <h3 class="text-xl font-semibold mb-4 text-emerald-600">智能种子筛选</h3>
                        <div class="flex flex-col sm:flex-row items-center gap-4">
                            <div class="w-full sm:w-1/2">
                                <img src="https://source.unsplash.com/400x300/?seed,grain" alt="种子样本" class="rounded-lg shadow-md w-full object-cover">
                            </div>
                            <div class="flex-grow">
                                <button id="analyze-btn" class="btn btn-primary w-full sm:w-auto mb-2">开始分析</button>
                                <div id="analysis-result" class="ai-result-placeholder hidden">
                                    <p class="text-sm">分析结果将在这里显示</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 生长监测演示 -->
                    <div class="ai-demo-panel">
                        <h3 class="text-xl font-semibold mb-4 text-emerald-600">生长状况监测</h3>
                        <div id="growth-chart" class="h-64 bg-white rounded-lg shadow-inner"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 应用场景 -->
        <section id="application" class="py-16 md:py-24 bg-emerald-50">
            <div class="max-w-5xl mx-auto px-4">
                <h2 class="section-title">应用场景</h2>
                <p class="section-subtitle">
                    从实验室到田间地头，AI技术全面助力荞麦种植
                </p>
                <div class="grid md:grid-cols-3 gap-8">
                    <div class="feature-card">
                        <h3 class="text-xl font-semibold mb-2 text-emerald-600">种子质检</h3>
                        <p class="text-gray-600">AI快速筛选优质种子，提高种植成功率</p>
                    </div>
                    <div class="feature-card">
                        <h3 class="text-xl font-semibold mb-2 text-emerald-600">生长监测</h3>
                        <p class="text-gray-600">实时监测作物生长状况，及时发现问题</p>
                    </div>
                    <div class="feature-card">
                        <h3 class="text-xl font-semibold mb-2 text-emerald-600">产量预测</h3>
                        <p class="text-gray-600">基于历史数据预测产量，优化种植方案</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 种子分析演示
        document.getElementById('analyze-btn')?.addEventListener('click', function() {
            this.textContent = '分析中...';
            this.disabled = true;
            
            setTimeout(() => {
                document.getElementById('analysis-result').innerHTML = `
                    <p class="font-semibold">分析完成：</p>
                    <ul class="mt-2 space-y-1">
                        <li>优质种子：85%</li>
                        <li>发芽率预测：92%</li>
                        <li>建议：适合培育</li>
                    </ul>
                `;
                document.getElementById('analysis-result').classList.remove('hidden');
                this.textContent = '开始分析';
                this.disabled = false;
            }, 1500);
        });

        // 生长监测图表
        const ctx = document.getElementById('growth-chart');
        if (ctx) {
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['第1周', '第2周', '第3周', '第4周', '第5周', '第6周'],
                    datasets: [{
                        label: '生长高度 (cm)',
                        data: [5, 15, 30, 45, 60, 70],
                        borderColor: '#10B981',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        }

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href'))?.scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
