<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .mines-left, .timer {
            color: #2c3e50;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            gap: 2px;
            margin: 0 auto;
            max-width: 368px;
        }
        
        .cell {
            width: 40px;
            height: 40px;
            background: #bdc3c7;
            border: 2px solid #95a5a6;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        
        .cell:hover {
            background: #a0aec0;
            transform: scale(1.05);
        }
        
        .cell.revealed {
            background: #ecf0f1;
            border-color: #bdc3c7;
        }
        
        .cell.mine {
            background: #e74c3c;
            color: white;
        }
        
        .cell.flag {
            background: #f39c12;
            color: white;
        }
        
        .cell-1 { color: #3498db; }
        .cell-2 { color: #27ae60; }
        .cell-3 { color: #e74c3c; }
        .cell-4 { color: #8e44ad; }
        .cell-5 { color: #f39c12; }
        .cell-6 { color: #16a085; }
        .cell-7 { color: #d35400; }
        .cell-8 { color: #2c3e50; }
        
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-restart {
            background: #3498db;
            color: white;
        }
        
        .btn-restart:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn-back {
            background: #95a5a6;
            color: white;
        }
        
        .btn-back:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .game-over-content h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .game-over-content p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        
        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(9, 35px);
                grid-template-rows: repeat(9, 35px);
                max-width: 323px;
            }
            
            .cell {
                width: 35px;
                height: 35px;
                font-size: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .game-board {
                grid-template-columns: repeat(9, 30px);
                grid-template-rows: repeat(9, 30px);
                max-width: 278px;
            }
            
            .cell {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }
            
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💣 扫雷游戏</h1>
            <p>左键翻开格子，右键标记地雷</p>
        </div>
        
        <div class="game-info">
            <div class="mines-left">💣 剩余: <span id="minesCount">10</span></div>
            <div class="timer">⏱️ 时间: <span id="timer">0</span>s</div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- 游戏格子将由JavaScript生成 -->
        </div>
        
        <div class="controls">
            <button class="btn btn-restart" onclick="initGame()">🔄 重新开始</button>
            <button class="btn btn-back" onclick="window.location.href='home.html'">🏠 返回主页</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 9;
        const MINES_COUNT = 10;
        let board = [];
        let minesLeft = MINES_COUNT;
        let gameStarted = false;
        let gameOver = false;
        let timer = 0;
        let timerInterval;
        
        function initGame() {
            board = [];
            minesLeft = MINES_COUNT;
            gameStarted = false;
            gameOver = false;
            timer = 0;
            
            clearInterval(timerInterval);
            document.getElementById('minesCount').textContent = minesLeft;
            document.getElementById('timer').textContent = timer;
            
            // 创建空棋盘
            for (let i = 0; i < BOARD_SIZE; i++) {
                board[i] = [];
                for (let j = 0; j < BOARD_SIZE; j++) {
                    board[i][j] = {
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        adjacentMines: 0
                    };
                }
            }
            
            // 随机布置地雷
            let minesPlaced = 0;
            while (minesPlaced < MINES_COUNT) {
                const row = Math.floor(Math.random() * BOARD_SIZE);
                const col = Math.floor(Math.random() * BOARD_SIZE);
                
                if (!board[row][col].isMine) {
                    board[row][col].isMine = true;
                    minesPlaced++;
                }
            }
            
            // 计算每个格子周围的地雷数量
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (!board[i][j].isMine) {
                        board[i][j].adjacentMines = countAdjacentMines(i, j);
                    }
                }
            }
            
            renderBoard();
        }
        
        function countAdjacentMines(row, col) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    
                    const newRow = row + i;
                    const newCol = col + j;
                    
                    if (newRow >= 0 && newRow < BOARD_SIZE && 
                        newCol >= 0 && newCol < BOARD_SIZE && 
                        board[newRow][newCol].isMine) {
                        count++;
                    }
                }
            }
            return count;
        }
        
        function renderBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    
                    cell.addEventListener('click', () => handleCellClick(i, j));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(i, j);
                    });
                    
                    gameBoard.appendChild(cell);
                }
            }
        }
        
        function handleCellClick(row, col) {
            if (gameOver || board[row][col].isRevealed || board[row][col].isFlagged) {
                return;
            }
            
            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }
            
            if (board[row][col].isMine) {
                // 踩到地雷，游戏结束
                gameOver = true;
                revealAllMines();
                showGameOver(false);
                return;
            }
            
            revealCell(row, col);
            
            // 检查是否获胜
            if (checkWin()) {
                gameOver = true;
                showGameOver(true);
            }
        }
        
        function handleRightClick(row, col) {
            if (gameOver || board[row][col].isRevealed) {
                return;
            }
            
            const cell = board[row][col];
            cell.isFlagged = !cell.isFlagged;
            
            if (cell.isFlagged) {
                minesLeft--;
            } else {
                minesLeft++;
            }
            
            document.getElementById('minesCount').textContent = minesLeft;
            updateCellDisplay(row, col);
        }
        
        function revealCell(row, col) {
            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE || 
                board[row][col].isRevealed || board[row][col].isFlagged) {
                return;
            }
            
            board[row][col].isRevealed = true;
            updateCellDisplay(row, col);
            
            // 如果格子周围没有地雷，自动翻开周围的格子
            if (board[row][col].adjacentMines === 0) {
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue;
                        revealCell(row + i, col + j);
                    }
                }
            }
        }
        
        function updateCellDisplay(row, col) {
            const cellElement = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const cell = board[row][col];
            
            if (cell.isFlagged) {
                cellElement.textContent = '🚩';
                cellElement.className = 'cell flag';
            } else if (cell.isRevealed) {
                if (cell.isMine) {
                    cellElement.textContent = '💣';
                    cellElement.className = 'cell mine';
                } else if (cell.adjacentMines > 0) {
                    cellElement.textContent = cell.adjacentMines;
                    cellElement.className = `cell revealed cell-${cell.adjacentMines}`;
                } else {
                    cellElement.textContent = '';
                    cellElement.className = 'cell revealed';
                }
            } else {
                cellElement.textContent = '';
                cellElement.className = 'cell';
            }
        }
        
        function revealAllMines() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j].isMine) {
                        board[i][j].isRevealed = true;
                        updateCellDisplay(i, j);
                    }
                }
            }
        }
        
        function checkWin() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = board[i][j];
                    if (!cell.isMine && !cell.isRevealed) {
                        return false;
                    }
                }
            }
            return true;
        }
        
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameOver) {
                    timer++;
                    document.getElementById('timer').textContent = timer;
                }
            }, 1000);
        }
        
        function showGameOver(isWin) {
            clearInterval(timerInterval);
            
            const gameOverDiv = document.createElement('div');
            gameOverDiv.className = 'game-over';
            gameOverDiv.innerHTML = `
                <div class="game-over-content">
                    <h2>${isWin ? '🎉 恭喜你赢了！' : '💥 游戏结束'}</h2>
                    <p>${isWin ? '你成功避开了所有地雷！' : '你不小心踩到了地雷！'}</p>
                    <p>用时: ${timer} 秒</p>
                    <button class="btn btn-restart" onclick="initGame(); this.parentElement.parentElement.remove()">
                        🔄 再玩一次
                    </button>
                </div>
            `;
            
            document.body.appendChild(gameOverDiv);
        }
        
        // 初始化游戏
        initGame();
    </script>
</body>
</html>
