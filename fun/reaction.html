<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反应速度测试</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .container {
            text-align: center;
            color: white;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5em;
        }
        .icon {
            font-size: 5em;
            margin-bottom: 20px;
            display: block;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 100;
        }
        .back-btn:hover {
            background: rgba(0,0,0,0.4);
        }
        
        /* States */
        .waiting {
            background-color: #ce2636; /* Red */
        }
        .ready {
            background-color: #ce2636; /* Red */
        }
        .now {
            background-color: #4bdb6a; /* Green */
        }
        .result {
            background-color: #2b87d1; /* Blue */
        }
    </style>
</head>
<body class="waiting">
    <a href="home.html" class="back-btn">← 返回主页</a>

    <div class="container">
        <span class="icon" id="icon">⚡</span>
        <h1 id="title">反应速度测试</h1>
        <p id="message">点击屏幕开始测试</p>
    </div>

    <script>
        const body = document.body;
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const icon = document.getElementById('icon');
        
        let startTime;
        let endTime;
        let timeoutId;
        let state = 'waiting'; // waiting, ready, now, result

        function setState(newState) {
            state = newState;
            body.className = newState;
            
            switch(newState) {
                case 'waiting':
                    title.innerText = "反应速度测试";
                    message.innerText = "点击屏幕开始测试";
                    icon.innerText = "⚡";
                    break;
                case 'ready':
                    title.innerText = "等待变绿...";
                    message.innerText = "看到绿色立即点击";
                    icon.innerText = "🔴";
                    break;
                case 'now':
                    title.innerText = "点击！";
                    message.innerText = "快！快！快！";
                    icon.innerText = "🟢";
                    break;
                case 'result':
                    const time = endTime - startTime;
                    title.innerText = time + " ms";
                    message.innerText = "点击再次尝试";
                    icon.innerText = "⏱️";
                    
                    // Save best score
                    const best = localStorage.getItem('reaction_best');
                    if (!best || time < best) {
                        localStorage.setItem('reaction_best', time);
                        message.innerText += ` (新纪录!)`;
                    } else {
                        message.innerText += ` (最佳: ${best} ms)`;
                    }
                    break;
            }
        }

        function handleClick() {
            switch(state) {
                case 'waiting':
                    setState('ready');
                    const randomDelay = Math.floor(Math.random() * 3000) + 2000; // 2-5 seconds
                    timeoutId = setTimeout(() => {
                        startTime = Date.now();
                        setState('now');
                    }, randomDelay);
                    break;
                    
                case 'ready':
                    clearTimeout(timeoutId);
                    title.innerText = "太快了！";
                    message.innerText = "请等待变成绿色后再点击";
                    icon.innerText = "⚠️";
                    body.className = 'waiting'; // Keep red background but change text
                    state = 'waiting'; // Reset to waiting state logic-wise but let user click to restart
                    break;
                    
                case 'now':
                    endTime = Date.now();
                    setState('result');
                    break;
                    
                case 'result':
                    setState('waiting');
                    break;
            }
        }

        // Handle both click and touch
        document.addEventListener('mousedown', handleClick);
        document.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent double firing with mouse events
            handleClick();
        }, {passive: false});
        
        // Prevent spacebar from scrolling and use it for interaction
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleClick();
            }
        });

    </script>
</body>
</html>
