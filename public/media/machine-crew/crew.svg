  <text x="24" y="382" font-size="11" fill="#94a3b8">三层闸门：规矩住在脚本里，不住在 wiki 里</text>
  <g>
    <rect x="24" y="394" width="300" height="100" rx="8" fill="#111c33" stroke="#f59e0b"/>
    <text x="174" y="418" text-anchor="middle" font-size="12.5" fill="#fbbf24">① 能机检 → 脚本拒收</text>
    <text x="174" y="440" text-anchor="middle" font-size="10" fill="#cbd5e1">merge-pr.ts：conventional 前缀</text>
    <text x="174" y="456" text-anchor="middle" font-size="10" fill="#cbd5e1">+ ≤72 字符 + 小写开头 + 无句号</text>
    <text x="174" y="472" text-anchor="middle" font-size="10" fill="#94a3b8">不合规 → 直接拒绝合并</text>
  </g>
  <g>
    <rect x="342" y="394" width="300" height="100" rx="8" fill="#111c33" stroke="#24344f"/>
    <text x="492" y="418" text-anchor="middle" font-size="12.5" fill="#e5e7eb">② 合规率（近 100 条）</text>
