  <g>
    <rect x="660" y="394" width="300" height="100" rx="8" fill="#111c33" stroke="#24344f"/>
    <text x="810" y="418" text-anchor="middle" font-size="12.5" fill="#e5e7eb">③ 不能机检 → 清单</text>
    <text x="810" y="440" text-anchor="middle" font-size="10" fill="#cbd5e1">CONTRIBUTING：人话一句 +</text>
    <text x="810" y="456" text-anchor="middle" font-size="10" fill="#cbd5e1">验证场景 + 责任在人</text>
    <text x="810" y="472" text-anchor="middle" font-size="10" fill="#94a3b8">对外来机器人严格，对自家放行</text>
