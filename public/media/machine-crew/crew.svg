    <text x="492" y="456" text-anchor="middle" font-size="10" fill="#cbd5e1">人类最长写过 119 字符</text>
    <text x="492" y="472" text-anchor="middle" font-size="10" fill="#94a3b8">闸门只管愿意走闸门的人</text>
