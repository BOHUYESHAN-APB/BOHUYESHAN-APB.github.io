  <g fill="none" stroke="#fbbf24" stroke-width="1.6">
    <path d="M 568 186 C 568 212 410 212 410 190"/>
  </g>
  <polygon points="404,198 410,188 416,198" fill="#f59e0b"/>
  <text x="489" y="216" text-anchor="middle" font-size="9.5" fill="#fbbf24">分钟级回修</text>

