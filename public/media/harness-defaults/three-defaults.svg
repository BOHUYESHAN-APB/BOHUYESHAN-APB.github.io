<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'Noto Sans SC', 'PingFang SC', system-ui, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#0f172a"/>
  <text x="500" y="38" text-anchor="middle" font-size="18" fill="#e5e7eb">同一种结构，三组默认值</text>
  <text x="500" y="62" text-anchor="middle" font-size="12.5" fill="#94a3b8">底座相同：插件注册 + 事件总线　　差异只有三处：可撤销性 · 默认工具面 · 发行方式</text>

  <g>
    <rect x="24" y="88" width="300" height="316" rx="10" fill="#0b1220" stroke="#24344f"/>
    <text x="174" y="118" text-anchor="middle" font-size="16" fill="#7dd3fc">Pi</text>
    <text x="174" y="140" text-anchor="middle" font-size="11" fill="#94a3b8">极简内核，按需扩展</text>

    <text x="44" y="174" font-size="12" fill="#e5e7eb">默认工具面</text>
    <rect x="44" y="184" width="260" height="58" rx="6" fill="#111c33" stroke="#24344f"/>
    <text x="58" y="204" font-size="11" fill="#cbd5e1">read · bash · powershell · edit</text>
    <text x="58" y="224" font-size="11" fill="#cbd5e1">write · grep · find · ls　（8）</text>

    <text x="44" y="270" font-size="12" fill="#e5e7eb">可撤销性</text>
    <rect x="44" y="280" width="260" height="46" rx="6" fill="#111c33" stroke="#24344f"/>
    <text x="58" y="298" font-size="11" fill="#f59e0b">协作式回调：session_shutdown</text>
    <text x="58" y="316" font-size="11" fill="#94a3b8">无逆操作账本，清理是作者义务</text>

    <text x="44" y="352" font-size="12" fill="#e5e7eb">发行方式</text>
    <text x="44" y="372" font-size="11" fill="#cbd5e1">Extensions · Skills · Prompt · 包，自装</text>
    <text x="44" y="390" font-size="11" fill="#64748b">无 subagent / plan mode</text>
  </g>

  <g>
    <rect x="348" y="88" width="304" height="316" rx="10" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="500" y="118" text-anchor="middle" font-size="16" fill="#fbbf24">DSH</text>
    <text x="500" y="140" text-anchor="middle" font-size="11" fill="#94a3b8">一切皆插件，可逆组合</text>

    <text x="368" y="174" font-size="12" fill="#e5e7eb">默认工具面</text>
    <rect x="368" y="184" width="264" height="58" rx="6" fill="#111c33" stroke="#24344f"/>
    <text x="382" y="204" font-size="11" fill="#cbd5e1">工具目录 25 个 dsh-tool-*</text>
    <text x="382" y="224" font-size="11" fill="#94a3b8">bash · fs · lsp · web · subagent …</text>

    <text x="368" y="270" font-size="12" fill="#e5e7eb">可撤销性</text>
    <rect x="368" y="280" width="264" height="46" rx="6" fill="#0b2237" stroke="#38bdf8"/>
    <text x="382" y="298" font-size="11" fill="#7dd3fc">可逆效果：runtime 持有逆</text>
    <text x="382" y="316" font-size="11" fill="#94a3b8">Cordis，arXiv 2608.25512</text>

    <text x="368" y="352" font-size="12" fill="#e5e7eb">发行方式</text>
    <text x="368" y="372" font-size="11" fill="#cbd5e1">官方组合包 + 运行时临时挂载</text>
    <text x="368" y="390" font-size="11" fill="#f87171">进程内有效，不落盘、无审计</text>
  </g>

  <g>
    <rect x="676" y="88" width="300" height="316" rx="10" fill="#0b1220" stroke="#24344f"/>
    <text x="826" y="118" text-anchor="middle" font-size="16" fill="#a5b4fc">OMP / Zeta</text>
    <text x="826" y="140" text-anchor="middle" font-size="11" fill="#94a3b8">全量预置，按需打开</text>

    <text x="696" y="174" font-size="12" fill="#e5e7eb">默认工具面</text>
    <rect x="696" y="184" width="260" height="58" rx="6" fill="#111c33" stroke="#24344f"/>
    <text x="710" y="204" font-size="11" fill="#cbd5e1">31 内置工具 · 60+ provider</text>
    <text x="710" y="224" font-size="11" fill="#94a3b8">14 LSP · 28 DAP 操作</text>

    <text x="696" y="270" font-size="12" fill="#e5e7eb">可撤销性</text>
    <rect x="696" y="280" width="260" height="46" rx="6" fill="#111c33" stroke="#24344f"/>
    <text x="710" y="298" font-size="11" fill="#f59e0b">继承 Pi 的回调语义</text>
    <text x="710" y="316" font-size="11" fill="#94a3b8">无逆账本</text>

    <text x="696" y="352" font-size="12" fill="#e5e7eb">装载模式</text>
    <text x="696" y="372" font-size="11" fill="#cbd5e1">essential：每轮下发 schema</text>
    <text x="696" y="390" font-size="11" fill="#cbd5e1">discoverable：缺能力时再装</text>
  </g>

  <g>
    <rect x="24" y="424" width="952" height="86" rx="10" fill="#111c33" stroke="#24344f"/>
    <text x="44" y="450" font-size="12.5" fill="#e5e7eb">共同底座：插件注册 · 事件总线 · 能力以包分发 · 模型与工具均可替换</text>
    <text x="44" y="474" font-size="12.5" fill="#94a3b8">结构差异只有三条：可撤销性有没有形式保证 · 默认工具面多大 · 能力怎么发行</text>
    <text x="44" y="498" font-size="12.5" fill="#f87171">共同风险：npm 供应链投毒 · 无能力清单 · 运行时挂载绕过审计</text>
  </g>

  <text x="24" y="544" font-size="11" fill="#64748b">来源：Pi 扩展文档（内置工具 8 个）；DSH tool-catalog（25 个 dsh-tool-*）；OMP README（31 工具 / 60+ provider / 14 LSP / 28 DAP）；Zeta 代码（loadMode）。</text>
  <text x="24" y="566" font-size="11" fill="#64748b">Cordis 论文：A Programming Paradigm for Spatiotemporal Composability — 可逆效果 + 反应式协效果。</text>
  <text x="24" y="588" font-size="11" fill="#64748b">Zeta 相对上游 oh-my-pi 领先 2242 个提交（2026-11-01 实测）。</text>
</svg>
