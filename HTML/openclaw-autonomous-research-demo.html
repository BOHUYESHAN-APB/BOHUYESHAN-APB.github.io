  <style>
:root {
  --bg: #eef3f8;
  --bg-soft: #f8fbff;
  --panel: rgba(255, 255, 255, 0.6);
  --panel-strong: rgba(255, 255, 255, 0.76);
  --panel-clear: rgba(255, 255, 255, 0.38);
  --line: rgba(151, 168, 194, 0.26);
  --line-strong: rgba(255, 255, 255, 0.66);
  --text: #0f1728;
  --muted: #5f6e86;
  --accent: #4b7cff;
  --accent-2: #5fd2ff;
  --shadow: 0 30px 80px rgba(77, 99, 128, 0.18);
  --shadow-soft: 0 18px 45px rgba(92, 112, 142, 0.12);
  --radius: 28px;
  --stage-width: 1920;
  --stage-height: 1080;
}

.slide {
  --theme: #4b7cff;
  --theme-soft: rgba(75, 124, 255, 0.12);
  --theme-line: rgba(75, 124, 255, 0.28);
  --theme-ink: #24457e;
}

.slide[data-theme="blue"] {
  --theme: #4b7cff;
  --theme-soft: rgba(75, 124, 255, 0.12);
  --theme-line: rgba(75, 124, 255, 0.28);
  --theme-ink: #24457e;
}

.slide[data-theme="warm"] {
  --theme: #ff9b54;
  --theme-soft: rgba(255, 155, 84, 0.18);
  --theme-line: rgba(255, 155, 84, 0.30);
  --theme-ink: #8c4a17;
}

.slide[data-theme="violet"] {
  --theme: #8b72ff;
  --theme-soft: rgba(139, 114, 255, 0.18);
  --theme-line: rgba(139, 114, 255, 0.30);
  --theme-ink: #4d40a8;
}

.slide[data-theme="teal"] {
  --theme: #42b8c8;
  --theme-soft: rgba(66, 184, 200, 0.18);
  --theme-line: rgba(66, 184, 200, 0.30);
  --theme-ink: #226c7b;
}

.slide[data-theme="indigo"] {
  --theme: #5f7ad9;
  --theme-soft: rgba(95, 122, 217, 0.18);
  --theme-line: rgba(95, 122, 217, 0.30);
  --theme-ink: #314892;
}

.slide[data-theme="amber"] {
  --theme: #f0a649;
  --theme-soft: rgba(240, 166, 73, 0.18);
  --theme-line: rgba(240, 166, 73, 0.30);
  --theme-ink: #8a5510;
}

.slide[data-theme="green"] {
  --theme: #49b97d;
  --theme-soft: rgba(73, 185, 125, 0.18);
  --theme-line: rgba(73, 185, 125, 0.30);
  --theme-ink: #216b47;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background:
    radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 24%),
    radial-gradient(circle at 85% 8%, rgba(196, 228, 255, 0.8), transparent 26%),
    radial-gradient(circle at bottom right, rgba(226, 236, 247, 0.7), transparent 30%),
    var(--bg);
  color: var(--text);
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  height: var(--app-height, 100dvh);
  overflow: hidden;
}

.app-shell {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(280px, 19vw, 340px);
  gap: clamp(12px, 1vw, 18px);
  width: 100%;
  height: var(--app-height, 100dvh);
  padding: clamp(10px, 1vw, 18px);
  align-items: stretch;
}

.app-shell > * {
  min-height: 0;
}

.preview-shell,
.control-panel {
  background: var(--panel);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  border-radius: var(--radius);
  backdrop-filter: blur(28px) saturate(150%);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
}

.preview-shell {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  height: 100%;
  padding: clamp(12px, 1vw, 18px);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.82), rgba(248,251,255,0.6)),
    var(--panel);
}

.preview-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 0 2px clamp(8px, 0.9vw, 14px);
  color: var(--muted);
}

.preview-title-group {
  display: grid;
  gap: 4px;
}

.preview-topbar strong {
  display: block;
  color: var(--text);
  margin-bottom: 4px;
}

.recording-badge {
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  color: #23406d;
  background: rgba(255,255,255,0.42);
  padding: 10px 14px;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.72), 0 10px 24px rgba(130,149,179,0.12);
}

.preview-viewport {
  position: relative;
  display: block;
  flex: 1;
  overflow: hidden;
  border-radius: 22px;
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.88), rgba(255,255,255,0.18) 55%),
    linear-gradient(180deg, rgba(240,245,250,0.94), rgba(226,234,244,0.86));
  border: 1px solid rgba(255,255,255,0.85);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
  padding: clamp(10px, 1vw, 22px);
  min-height: 0;
  height: 100%;
}

.stage-frame {
  position: absolute;
  inset: clamp(8px, 0.8vw, 18px);
  border-radius: 24px;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0.08)),
    rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.64);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
  backdrop-filter: blur(20px);
}

.stage-scale {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  display: block;
  transform-origin: top left;
  will-change: transform;
}

.presentation-stage {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  border-radius: 36px;
  background:
    radial-gradient(circle at 16% 18%, rgba(255,255,255,0.95), transparent 20%),
    radial-gradient(circle at 82% 15%, rgba(205,233,255,0.75), transparent 21%),
    radial-gradient(circle at 78% 80%, rgba(224,242,255,0.65), transparent 24%),
    linear-gradient(135deg, #f8fbff 0%, #edf3f8 42%, #e7eef6 100%);
  border: 1px solid rgba(255,255,255,0.88);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.95),
    0 32px 60px rgba(101, 122, 154, 0.16);
}

.presentation-stage::before,
.presentation-stage::after {
  content: "";
  position: absolute;
  inset: auto;
  pointer-events: none;
}

.presentation-stage::before {
  top: 54px;
  left: 64px;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(167,206,255,0.4), transparent 70%);
  filter: blur(8px);
}

.presentation-stage::after {
  right: 84px;
  bottom: 42px;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 72%);
  filter: blur(12px);
}

.slide {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(460px, 0.92fr);
  gap: 30px;
  padding: 108px 52px 112px;
  --theme: #4b7cff;
  --theme-soft: rgba(75, 124, 255, 0.12);
  --theme-line: rgba(75, 124, 255, 0.28);
  --theme-ink: #24457e;
}

.slide[data-theme="blue"] {
  --theme: #4b7cff;
  --theme-soft: rgba(75, 124, 255, 0.12);
  --theme-line: rgba(75, 124, 255, 0.28);
  --theme-ink: #24457e;
}

.slide[data-theme="warm"] {
  --theme: #ff9b54;
  --theme-soft: rgba(255, 155, 84, 0.14);
  --theme-line: rgba(255, 155, 84, 0.30);
  --theme-ink: #8c4a17;
}

.slide[data-theme="violet"] {
  --theme: #8b72ff;
  --theme-soft: rgba(139, 114, 255, 0.14);
  --theme-line: rgba(139, 114, 255, 0.30);
  --theme-ink: #4d40a8;
}

.slide[data-theme="teal"] {
  --theme: #42b8c8;
  --theme-soft: rgba(66, 184, 200, 0.14);
  --theme-line: rgba(66, 184, 200, 0.30);
  --theme-ink: #226c7b;
}

.slide[data-theme="indigo"] {
  --theme: #5f7ad9;
  --theme-soft: rgba(95, 122, 217, 0.14);
  --theme-line: rgba(95, 122, 217, 0.30);
  --theme-ink: #314892;
}

.slide[data-theme="amber"] {
  --theme: #f0a649;
  --theme-soft: rgba(240, 166, 73, 0.14);
  --theme-line: rgba(240, 166, 73, 0.30);
  --theme-ink: #8a5510;
}

.slide[data-theme="green"] {
  --theme: #49b97d;
  --theme-soft: rgba(73, 185, 125, 0.14);
  --theme-line: rgba(73, 185, 125, 0.30);
  --theme-ink: #216b47;
}

.slide::before {
  content: "";
  position: absolute;
  inset: 18px;
  border-radius: 36px;
  pointer-events: none;
  background:
    linear-gradient(135deg, var(--theme-soft), transparent 34%),
    radial-gradient(circle at 86% 16%, rgba(255,255,255,0.46), transparent 24%);
  opacity: 0.96;
}

.slide::after {
  content: "";
  position: absolute;
  inset: auto 46px 94px auto;
  width: 240px;
  height: 240px;
  border-radius: 30px;
  transform: rotate(10deg);
  background: linear-gradient(180deg, rgba(255,255,255,0.08), var(--theme-soft));
  border: 1px dashed var(--theme-line);
  opacity: 0.62;
  pointer-events: none;
}

.slide--board,
.slide--comparison,
.slide--editorial,
.slide--protocol {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

.slide--board {
  grid-template-rows: auto minmax(320px, 1fr) auto;
}

.slide--comparison {
  grid-template-columns: minmax(0, 1.08fr) minmax(420px, 0.92fr);
  grid-template-rows: auto minmax(0, 1fr);
}

.slide--editorial {
  grid-template-rows: auto minmax(0, 1fr);
}

.slide--protocol {
  grid-template-columns: minmax(0, 1.08fr) minmax(420px, 0.92fr);
  grid-template-rows: auto minmax(0, 1fr);
}

.slide-main,
.slide-side {
  position: relative;
  z-index: 1;
}

.slide-header,
.slide-board,
.slide-foot,
.slide-compare-main,
.slide-compare-side,
.slide-editorial-sections,
.slide-editorial-visual,
.slide-protocol-left,
.slide-protocol-right {
  position: relative;
  z-index: 1;
  min-height: 0;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.78);
  box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.9);
}

.slide-header,
.slide-board,
.slide-foot,
.slide-compare-main,
.slide-compare-side,
.slide-editorial-sections,
.slide-editorial-visual,
.slide-protocol-left,
.slide-protocol-right {
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.82), rgba(243,247,252,0.68)),
    linear-gradient(135deg, var(--theme-soft), transparent 44%);
}

.slide-main {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 22px;
  min-width: 0;
  padding: 42px 44px 34px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.78);
  box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.9);
}

.slide-side {
  display: flex;
  align-items: stretch;
}

.slide-header {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
  gap: 24px;
  padding: 28px 32px;
}

.header-side {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
}

.slide-board {
  grid-column: 1 / -1;
  padding: 22px;
  min-height: 320px;
  overflow: hidden;
}

.slide--board .slide-header {
  grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
}

.slide-foot {
  grid-column: 1 / -1;
  padding: 18px 22px;
  overflow: hidden;
}

.slide--board .slide-foot .detail-rail {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.slide-compare-main,
.slide-editorial-sections,
.slide-protocol-right {
  padding: 26px 28px;
}

.slide-protocol-right .detail-grid,
.slide-compare-main .detail-grid,
.slide-editorial-sections .detail-grid {
  grid-template-columns: 1fr;
  gap: 12px;
}

.slide-protocol-right .detail-card,
.slide-compare-main .detail-card,
.slide-editorial-sections .detail-card {
  padding: 14px 16px;
}

.slide-protocol-right .detail-card h3,
.slide-compare-main .detail-card h3,
.slide-editorial-sections .detail-card h3 {
  font-size: 20px;
  line-height: 1.3;
}

.slide-protocol-right .detail-card p,
.slide-protocol-right .detail-card li,
.slide-compare-main .detail-card p,
.slide-compare-main .detail-card li,
.slide-editorial-sections .detail-card p,
.slide-editorial-sections .detail-card li {
  font-size: 17px;
  line-height: 1.6;
}

.slide-compare-side,
.slide-editorial-visual,
.slide-protocol-left {
  padding: 18px;
}

.slide-editorial-bottom {
  grid-column: 1 / -1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(420px, 0.88fr);
  gap: 26px;
}

.slide[data-variant="hero-right"].slide--editorial .slide-editorial-bottom {
  grid-template-columns: minmax(0, 0.92fr) minmax(520px, 1.08fr);
}

.slide[data-variant="hero-stack-top"].slide--editorial {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
}

.slide[data-template="evidence-rail"].slide--comparison,
.slide[data-template="matrix-brief"].slide--comparison,
.slide[data-template="handoff-focus"].slide--comparison,
.slide[data-template="strategy-compare"].slide--comparison {
  grid-template-rows: auto minmax(0, 1fr);
}

.slide[data-template="protocol-map"].slide--protocol {
  grid-template-columns: minmax(520px, 1.14fr) minmax(0, 0.86fr);
  grid-template-rows: auto minmax(0, 1fr);
}

.slide-top-split--hero-stack {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
  gap: 20px;
  min-height: 238px;
  align-items: stretch;
}

.slide-header--evidence-rail,
.slide-header--matrix-brief,
.slide-header--handoff-focus,
.slide-header--protocol-map {
  grid-column: 1 / -1;
  display: grid;
  align-items: stretch;
  gap: 18px;
}

.slide-header--evidence-rail {
  grid-template-columns: minmax(0, 1.05fr) minmax(300px, 0.95fr);
}

.slide-header--matrix-brief {
  grid-template-columns: minmax(0, 0.92fr) minmax(340px, 1.08fr);
}

.slide-header--handoff-focus {
  grid-template-columns: minmax(0, 0.9fr) minmax(300px, 1.1fr);
}

.slide-header--protocol-map {
  grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr);
}

.header-side--evidence-rail,
.header-side--matrix-brief,
.header-side--handoff-focus,
.header-side--protocol-map {
  display: grid;
  align-content: start;
  gap: 12px;
}

.quote-box--evidence-rail,
.quote-box--matrix-brief,
.quote-box--protocol-map {
  min-height: 86px;
}

.slide-compare-main--evidence-rail,
.slide-compare-main--matrix-brief,
.slide-compare-main--handoff-focus {
  padding: 20px;
}

.slide-compare-side--evidence-rail,
.slide-compare-side--matrix-brief,
.slide-compare-side--handoff-focus {
  padding: 20px;
}

.slide-compare-main--evidence-rail {
  clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%);
}

.slide-compare-side--evidence-rail {
  clip-path: polygon(4% 0, 100% 0, 100% 94%, 0 100%, 0 8%);
}

.slide-compare-main--matrix-brief {
  clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%);
}

.slide-compare-side--matrix-brief {
  clip-path: polygon(3% 0, 100% 0, 100% 100%, 0 94%, 0 10%);
}

.slide-compare-main--handoff-focus {
  clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
}

.slide-compare-side--handoff-focus {
  clip-path: polygon(5% 0, 100% 0, 100% 100%, 0 92%, 0 8%);
}

.slide-protocol-left--protocol-map,
.slide-protocol-right--protocol-map {
  padding: 20px;
}

.slide-protocol-left--protocol-map {
  clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%);
}

.slide-protocol-right--protocol-map {
  clip-path: polygon(5% 0, 100% 0, 100% 100%, 0 94%, 0 8%);
}

.slide[data-template="evidence-rail"] .detail-grid,
.slide[data-template="matrix-brief"] .detail-grid,
.slide[data-template="handoff-focus"] .detail-grid,
.slide[data-template="protocol-map"] .detail-grid {
  grid-template-columns: 1fr;
  gap: 12px;
}

.slide[data-template="evidence-rail"] .detail-card,
.slide[data-template="matrix-brief"] .detail-card,
.slide[data-template="handoff-focus"] .detail-card,
.slide[data-template="protocol-map"] .detail-card {
  padding: 14px 16px;
}

.slide[data-template="evidence-rail"] .detail-card h3,
.slide[data-template="matrix-brief"] .detail-card h3,
.slide[data-template="handoff-focus"] .detail-card h3,
.slide[data-template="protocol-map"] .detail-card h3 {
  font-size: 19px;
}

.slide[data-template="evidence-rail"] .detail-card p,
.slide[data-template="evidence-rail"] .detail-card li,
.slide[data-template="matrix-brief"] .detail-card p,
.slide[data-template="matrix-brief"] .detail-card li,
.slide[data-template="handoff-focus"] .detail-card p,
.slide[data-template="handoff-focus"] .detail-card li,
.slide[data-template="protocol-map"] .detail-card p,
.slide[data-template="protocol-map"] .detail-card li {
  font-size: 17px;
  line-height: 1.58;
}

.slide[data-template="handoff-focus"] .detail-card p,
.slide[data-template="handoff-focus"] .detail-card li,
.slide[data-template="protocol-map"] .detail-card p,
.slide[data-template="protocol-map"] .detail-card li {
  font-size: 17.5px;
}

.slide[data-template="evidence-rail"] .visual-card,
.slide[data-template="matrix-brief"] .visual-card,
.slide[data-template="handoff-focus"] .visual-card,
.slide[data-template="protocol-map"] .visual-card {
  background-image:
    linear-gradient(150deg, rgba(255,255,255,0.78), rgba(255,255,255,0.22)),
    linear-gradient(135deg, var(--theme-soft), transparent 54%);
}

.slide[data-template="handoff-focus"] .visual-card {
  padding: 24px;
  gap: 14px;
}

.slide[data-template="handoff-focus"] .slide-meta {
  gap: 10px;
}

.slide[data-template="handoff-focus"] .slide-meta .chip-row {
  gap: 8px;
}

.slide[data-template="handoff-focus"] .slide-meta .chip {
  padding: 8px 14px;
  font-size: 16px;
}

.slide[data-template="evidence-rail"] .slide-header::after,
.slide[data-template="matrix-brief"] .slide-header::after,
.slide[data-template="handoff-focus"] .slide-header::after,
.slide[data-template="protocol-map"] .slide-header::after {
  content: "";
  position: absolute;
  right: 18px;
  top: 14px;
  width: 130px;
  height: 40px;
  border-radius: 999px;
  border: 1px dashed rgba(255,255,255,0.82);
  background: linear-gradient(135deg, var(--theme-soft), rgba(255,255,255,0.22));
  opacity: 0.88;
}

.hero-stack-copy-panel,
.hero-stack-aside-panel {
  min-width: 0;
  min-height: 0;
}

.hero-stack-copy-panel {
  padding: 22px 24px 18px;
  display: grid;
  grid-template-rows: auto minmax(74px, auto);
  gap: 14px;
}

.hero-stack-aside-panel {
  padding: 18px 18px 16px;
  clip-path: polygon(10% 0, 100% 0, 100% 88%, 0 100%, 0 12%);
}

.hero-stack-copy {
  display: grid;
  grid-template-rows: auto auto auto;
  align-content: start;
  gap: 10px;
  min-width: 0;
}

.quote-box--hero-stack {
  min-height: 74px;
  display: flex;
  align-items: center;
  margin-top: 0;
}

.hero-stack-aside {
  display: grid;
  grid-template-rows: minmax(104px, auto) minmax(0, 1fr);
  gap: 14px;
  min-width: 0;
}

.hero-stack-capsules {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  align-content: start;
  gap: 10px;
  padding: 2px 0;
}

.hero-stack-spot {
  min-height: 100%;
  border-radius: 28px;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.9), rgba(244,249,255,0.7)),

  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.decision-root strong {
  display: block;
  margin-top: 8px;
  font-size: 24px;
  line-height: 1.35;
  color: #143058;
}

.decision-branches {
  position: relative;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.decision-branches::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -10px;
  width: 62%;
  height: 22px;
  transform: translateX(-50%);
  border-top: 2px dashed rgba(93, 147, 255, 0.5);
  border-left: 2px dashed rgba(93, 147, 255, 0.5);
  border-right: 2px dashed rgba(93, 147, 255, 0.5);
  border-radius: 20px 20px 0 0;
}

.decision-branch {
  position: relative;
  padding: 14px 14px 12px;
  border-radius: 24px;
  border: 2px solid rgba(93, 147, 255, 0.32);
  background: rgba(255,255,255,0.82);
  box-shadow: 0 12px 22px rgba(121, 145, 179, 0.12);
}

.decision-branch::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -18px;
  width: 2px;
  height: 18px;
  background: repeating-linear-gradient(to bottom, #79a8ff 0 8px, transparent 8px 14px);
}

.decision-branch-label {
  color: #6281ae;
  font-size: 13px;
  font-weight: 700;
}

.decision-branch h4 {
  margin: 8px 0 6px;
  font-size: 22px;
  line-height: 1.35;
  color: #132f56;
}

.decision-branch p {
  margin: 0;
  font-size: 16px;
  line-height: 1.55;
  color: #526684;
}

.metric-value {
  font-size: 110px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.06em;
  color: #112c52;
}

.metric-detail {
  font-size: 22px;
  line-height: 1.5;
  color: var(--muted);
}

.visual-list,
.flow-list,
.ring-list,
.risk-list,
.keyword-list {
  display: grid;
  gap: 16px;
}

.visual-item,
.flow-item,
.risk-item,
.keyword-item,
.ring-item {
  border-radius: 22px;
  padding: 18px 20px;
  background: rgba(255,255,255,0.38);
  border: 1px solid rgba(255,255,255,0.76);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.86);
  font-size: 22px;
  line-height: 1.45;
  color: #21324e;
}

.flow-list {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.flow-item {
  position: relative;
}

.flow-item::after {
  content: "→";
  position: absolute;
  right: -18px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(85, 109, 143, 0.5);
  font-size: 30px;
}

.flow-item:nth-child(2n)::after,
.flow-item:last-child::after {
  display: none;
}

.node-center {
  display: grid;
  place-items: center;
  min-height: 220px;
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.82);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.72), rgba(224,238,255,0.42)),
    rgba(255,255,255,0.28);
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  color: #1f3d69;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
}

.satellite-grid,
.layer-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.satellite-card,
.layer-card {
  border-radius: 20px;
  background: rgba(255,255,255,0.38);
  border: 1px solid rgba(255,255,255,0.8);
  padding: 18px;
  text-align: center;
  font-size: 20px;
  color: #29405f;
}

.pole-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.pole-card {
  border-radius: 22px;
  min-height: 260px;
  padding: 30px;
  display: grid;
  place-items: center;
  text-align: center;
  white-space: pre-line;
  font-size: 30px;
  line-height: 1.45;
  border: 1px solid rgba(255,255,255,0.82);
  background: rgba(255,255,255,0.4);
  color: #1b3458;
}

.handoff-grid {
  display: grid;
  gap: 12px;
  align-content: center;
  min-height: 100%;
}

.handoff-arrow {
  display: flex;
  justify-content: center;
  gap: 10px;
  align-items: center;
  font-size: 24px;
  color: #5f7598;
  font-weight: 700;
}

.handoff-pill {
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.42);
  border: 1px solid rgba(255,255,255,0.82);
  color: #264267;
  font-size: 16px;
}

.handoff-grid .chip-row {
  gap: 8px;
  justify-content: center;
}

.handoff-grid .node-center {
  min-height: 148px;
  font-size: 30px;
}

.architecture-final {
  display: grid;
  gap: 18px;
}

.architecture-final .node-center {
  min-height: 170px;
}

.network-mesh-board {
  position: relative;
  min-height: 460px;
  height: 100%;
  width: 940px;
  border-radius: 28px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.82);
  background:
    radial-gradient(circle at 20% 20%, rgba(92, 220, 255, 0.16), transparent 22%),
    radial-gradient(circle at 80% 72%, rgba(92, 153, 255, 0.14), transparent 24%),
    repeating-linear-gradient(90deg, rgba(100, 162, 255, 0.05) 0 1px, transparent 1px 54px),
    linear-gradient(180deg, rgba(255,255,255,0.94), rgba(241,248,255,0.88));
  isolation: isolate;
}

.network-mesh-board::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(103, 194, 255, 0.06), transparent 45%);
  animation: networkGlow 4.6s ease-in-out infinite;
  pointer-events: none;
}

.network-mesh-grid,
.network-mesh-links {
  position: absolute;
  inset: 0;
}

.network-node {
  position: absolute;
  width: 26%;
  padding: 14px 15px 12px;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.86);
  background: rgba(255,255,255,0.78);
  box-shadow: 0 14px 28px rgba(99, 132, 180, 0.12);
  transform: translate(-50%, -50%);
  animation: nodeFloat 4.8s ease-in-out infinite;
}

.network-node--primary {
  background: linear-gradient(180deg, rgba(231,244,255,0.96), rgba(217,235,255,0.88));
}

.network-node--accent {
  background: linear-gradient(180deg, rgba(240,250,255,0.96), rgba(233,246,255,0.88));
}

.network-node--warning {
  background: linear-gradient(180deg, rgba(255,248,238,0.96), rgba(249,241,255,0.88));
}

.network-node:nth-child(2n) {
  animation-duration: 5.6s;
}

.network-node:nth-child(3n) {
  animation-duration: 6.4s;
}

.network-node-title {
  color: #14345d;
  font-size: 20px;
  font-weight: 800;
  line-height: 1.3;
}

.network-node p {
  margin: 8px 0 0;
  color: #536982;
  font-size: 15px;
  line-height: 1.42;
}

.network-beam {
  position: absolute;
  height: 3px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(95, 161, 255, 0.18), rgba(95, 161, 255, 0.72), rgba(95, 161, 255, 0.18));
  transform-origin: left center;
  filter: drop-shadow(0 0 8px rgba(89, 153, 255, 0.18));
}

.network-beam--accent {
  background: linear-gradient(90deg, rgba(84, 210, 187, 0.16), rgba(84, 210, 187, 0.72), rgba(84, 210, 187, 0.16));
}

.network-beam--warning {
  background: linear-gradient(90deg, rgba(240, 171, 76, 0.16), rgba(240, 171, 76, 0.72), rgba(240, 171, 76, 0.16));
}

.network-beam-pulse {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  margin-top: -8px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.96), rgba(112,175,255,0.92));
  box-shadow: 0 0 0 6px rgba(112,175,255,0.16);
  animation: beamTravel 2.4s linear infinite;
}

.network-beam-label {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.84);
  color: #5072a2;
  font-size: 13px;
  font-weight: 700;
}

.network-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.network-legend-pill {
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.84);
  background: rgba(255,255,255,0.58);
  color: #2f578d;
  font-size: 14px;
}

.terminal-sim-board::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 48px;
  height: 40px;
  background: linear-gradient(180deg, rgba(122, 180, 255, 0.08), transparent);
  animation: terminalScan 4.2s linear infinite;
  pointer-events: none;
}

.terminal-sim-board {
  min-height: 430px;
  height: 100%;
  width: 920px;
  border-radius: 26px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.18);
  background: linear-gradient(180deg, rgba(10,18,32,0.98), rgba(13,24,43,0.94));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 24px 44px rgba(9,18,34,0.26);
}

.terminal-topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.04);
  color: #cfd9ea;
}

.terminal-topbar span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
}

.terminal-topbar span:nth-child(1) { background: #ff7a7a; }
.terminal-topbar span:nth-child(2) { background: #ffd36d; }
.terminal-topbar span:nth-child(3) { background: #74df9a; }

.terminal-topbar strong {
  margin-left: 8px;
  font-size: 16px;
  font-weight: 700;
}

.terminal-body {
  display: grid;
  gap: 10px;
  padding: 18px 18px 14px;
}

.terminal-line {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: baseline;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 18px;
  line-height: 1.45;
  overflow: hidden;
  animation: terminalReveal 0.9s steps(18, end) both;
  animation-delay: var(--delay, 0ms);
}

.terminal-prompt {
  color: #7dd3fc;
  font-weight: 700;
}

.terminal-line--warn .terminal-prompt { color: #fbbf24; }
.terminal-line--ok .terminal-prompt { color: #4ade80; }

.terminal-text {
  color: #d8e2f0;
}

.terminal-line--warn .terminal-text { color: #fde68a; }
.terminal-line--ok .terminal-text { color: #bbf7d0; }

.terminal-footer {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px;
  align-items: center;
  padding: 10px 18px 16px;
}

.terminal-status {
  color: #8bb9ff;
  font-size: 15px;
  font-weight: 700;
}

.terminal-progress {
  height: 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}

.terminal-progress i {
  display: block;
  width: 34%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #4fd1ff, #7c9cff);
  animation: progressSweep 2.6s ease-in-out infinite;
}

.code-sim-board {
  min-height: 430px;
  height: 100%;
  width: 920px;
  border-radius: 26px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(180deg, rgba(18,25,44,0.98), rgba(17,22,36,0.95));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 24px 44px rgba(12,18,32,0.24);
}

.code-sim-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  color: #d6deeb;
}

.code-sim-topbar strong {
  font-size: 16px;
}

.code-sim-topbar span {
  color: #84ccff;
  font-size: 14px;
}

.code-sim-body {
  display: grid;
  gap: 8px;
  padding: 16px 18px 18px;
}

.code-line {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 14px;
  align-items: baseline;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 17px;
  line-height: 1.46;
  animation: codeReveal 0.9s steps(20, end) both;
  animation-delay: var(--delay, 0ms);
  overflow: hidden;
}

.code-no {
  color: #60708f;
  text-align: right;
}

.code-text {
  color: #d9e4f6;
}

.code-text--comment { color: #79c08a; }
.code-text--accent { color: #7fd8ff; }
.code-text--warning { color: #f5b56c; }

.code-line:last-child .code-text::after {
  content: "▋";
  margin-left: 2px;
  color: #84ccff;
  animation: cursorBlink 1s step-end infinite;
}

.chat-workflow-board {
  min-height: 430px;
  height: 100%;
  width: 1080px;
  border-radius: 28px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 16px;
  align-items: stretch;
}

.workflow-scenario-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  position: relative;
  z-index: 6;
}

.slide[data-scene="chat-handoff-immersive"] .workflow-scenario-tabs {
  margin-top: 12px;
  margin-left: 8px;
  padding: 8px 10px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(240,248,255,0.54));
  box-shadow: inset 0 0 0 1px rgba(118, 168, 245, 0.2), 0 8px 18px rgba(96, 136, 212, 0.16);
}

.slide[data-scene="chat-handoff-immersive"] .workflow-scenario-tabs::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 16px;
  pointer-events: none;
  box-shadow: 0 0 0 1px rgba(112, 166, 255, 0.25), 0 0 22px rgba(112, 166, 255, 0.28);
  animation: interactionGlow 2.1s ease-in-out infinite;
}

.workflow-scenario-btn {
  border: 1px solid rgba(122, 160, 223, 0.4);
  background: rgba(241, 248, 255, 0.88);
  color: #3d5f90;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 700;

.workflow-scenario-btn:hover {
  border-color: rgba(88, 138, 225, 0.6);
  background: rgba(228, 241, 255, 0.95);
}

.workflow-scenario-btn.is-active {
  color: #ffffff;
  border-color: transparent;
  background: linear-gradient(135deg, #4ea3ff, #6577ff);

  animation: tabBreath 2.2s ease-in-out infinite;
}

.slide[data-scene="chat-handoff-immersive"] .workflow-scenario-btn {
  position: relative;
  box-shadow: 0 2px 0 rgba(255,255,255,0.6), 0 0 0 1px rgba(114, 160, 236, 0.18);
}

.slide[data-scene="chat-handoff-immersive"] .workflow-scenario-btn::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 999px;
  pointer-events: none;
  box-shadow: 0 0 0 1px rgba(113, 171, 255, 0.2), 0 0 12px rgba(113, 171, 255, 0.26);
  animation: interactionGlow 2.4s ease-in-out infinite;
}

.chat-workflow-pane {
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.74);
  box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.9);
  display: grid;
  min-height: 0;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.chat-workflow-pane--chat {
  grid-template-rows: auto minmax(0, 1fr) auto;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.92), rgba(241, 250, 255, 0.88)),
    radial-gradient(circle at 18% 16%, rgba(106, 209, 255, 0.14), transparent 28%);
}

.chat-workflow-pane--terminal {
  grid-template-rows: auto minmax(0, 1fr) auto;
  background:
    linear-gradient(180deg, rgba(20, 28, 46, 0.97), rgba(17, 24, 40, 0.95)),
    radial-gradient(circle at 84% 14%, rgba(87, 120, 255, 0.22), transparent 24%);
  border-color: rgba(115, 144, 255, 0.28);
  overflow: hidden;
}

.chat-workflow-pane-title {
  padding: 12px 14px;
  font-size: 17px;
  font-weight: 700;
}

.chat-workflow-pane--terminal .chat-workflow-pane-title {
  color: #d6e3ff;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.chat-thread {
  display: grid;
  gap: 10px;
  padding: 12px 12px 10px;
  align-content: start;
  overflow: hidden;
}

.chat-msg {
  max-width: 92%;
  border-radius: 14px;
  padding: 11px 12px;
  display: grid;
  gap: 4px;
  border: 1px solid rgba(255,255,255,0.64);
  box-shadow: 0 10px 18px rgba(56, 96, 142, 0.1);
  animation: fadeInUp 1100ms cubic-bezier(.22,.78,.2,1) both;
  animation-delay: var(--delay, 0ms);
}

.chat-msg-role {
  font-size: 13px;
  font-weight: 700;
  opacity: 0.8;
}

.chat-msg-body {
  font-size: 16.5px;
  line-height: 1.54;
}

.chat-msg--user {
  justify-self: start;
  background: rgba(240, 247, 255, 0.95);
  border-color: rgba(128, 174, 230, 0.42);
}

.chat-msg--user .chat-msg-role { color: #3d78ba; }

.chat-msg--lobster {
  justify-self: end;
  background: rgba(233, 251, 245, 0.94);
  border-color: rgba(110, 197, 158, 0.44);
}

.chat-msg--lobster .chat-msg-role { color: #2e8b67; }

.chat-msg--opencode {
  justify-self: end;
  background: rgba(236, 242, 255, 0.95);
  border-color: rgba(118, 145, 221, 0.44);
}

.chat-msg--opencode .chat-msg-role { color: #415fa8; }

.chat-input-bar {
  margin: 0 12px 12px;
  border-radius: 12px;
  border: 1px solid rgba(117, 170, 219, 0.35);
  background: rgba(255,255,255,0.86);
  padding: 9px 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
}

.chat-input-placeholder {
  color: #6c7f96;
  font-size: 15px;
}

.chat-send {
  border: none;
  cursor: pointer;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  background: linear-gradient(135deg, #4ea3ff, #6577ff);
  animation: buttonBreath 2.3s ease-in-out infinite;

.slide[data-scene="chat-handoff-immersive"] .chat-send {
  box-shadow: 0 0 0 1px rgba(98, 151, 241, 0.35), 0 0 18px rgba(98, 151, 241, 0.36);
}

.chat-send:hover {
  filter: brightness(1.05);
}

.chat-send:disabled {
  opacity: 0.64;
  cursor: not-allowed;
  animation: none;
}

.chat-workflow-bridge {

  justify-items: center;
  align-content: center;
  gap: 10px;
  padding: 8px 4px;
  position: relative;
  z-index: 5;
}

.chat-workflow-bridge::before,
.chat-workflow-bridge::after {
  content: "";
  width: 88px;
  height: 3px;
  border-radius: 999px;
  opacity: 0.9;
  position: relative;
  z-index: 0;
}

.chat-workflow-bridge-pill,
.chat-workflow-bridge-arrow {
  position: relative;
  z-index: 1;
}

.chat-workflow-bridge::before {
  background: linear-gradient(90deg, rgba(95, 142, 233, 0.08), rgba(95, 142, 233, 0.95));
  animation: bridgeFlowForward 2.2s linear infinite;
}

.chat-workflow-bridge::after {
  background: linear-gradient(90deg, rgba(82, 184, 140, 0.08), rgba(82, 184, 140, 0.95));
  animation: bridgeFlowBackward 2.6s linear infinite;
}

.chat-workflow-bridge-pill {
  border-radius: 999px;
  border: 1px solid rgba(123, 157, 225, 0.38);
  background: rgba(239, 245, 255, 0.88);
  color: #3a5a86;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 10px;
  white-space: nowrap;
}

.chat-workflow-bridge-pill--back {
  border-color: rgba(115, 183, 149, 0.46);
  background: rgba(234, 250, 240, 0.88);
  color: #2f7c5b;
}

.chat-workflow-bridge-arrow {
  font-size: 20px;
  color: #6a7ea7;
  animation: pulse 2.4s ease-in-out infinite;
}

.terminal-stream {
  display: grid;
  gap: 8px;
  padding: 12px 12px 10px;
  align-content: start;
  overflow: hidden;
}

.terminal-stream-line {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: baseline;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 18px;
  line-height: 1.5;
  animation: terminalReveal 1.35s steps(24, end) both;
  animation-delay: var(--delay, 0ms);
  overflow: hidden;
  min-width: 0;
}

.terminal-stream-prefix {
  font-weight: 700;
  color: #84ccff;
}

.terminal-stream-text {
  color: #dce7ff;

@keyframes beamTravel {
  from { left: 0; opacity: 0.6; }
  20% { opacity: 1; }
  to { left: calc(100% - 16px); opacity: 0.75; }
}

@keyframes networkGlow {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.04); }
}

@keyframes nodeFloat {
  0%, 100% { transform: translate(-50%, -50%); }
  50% { transform: translate(-50%, calc(-50% - 6px)); }
}

@keyframes progressSweep {
  0% { transform: translateX(-100%); }
  55% { transform: translateX(180%); }
  100% { transform: translateX(180%); }
}

@keyframes terminalScan {
  from { transform: translateY(0); opacity: 0.15; }
  50% { opacity: 0.28; }
  to { transform: translateY(300px); opacity: 0.08; }
}

@keyframes terminalReveal {
  from { clip-path: inset(0 100% 0 0); opacity: 0.2; }
  to { clip-path: inset(0 0 0 0); opacity: 1; }
}

@keyframes tabBreath {
  0%, 100% { transform: translateY(0); box-shadow: 0 10px 22px rgba(77, 121, 219, 0.28); }
  50% { transform: translateY(-1px); box-shadow: 0 13px 26px rgba(77, 121, 219, 0.34); }
}

@keyframes buttonBreath {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-1px); }
}

@keyframes bridgeFlowForward {
  0% { transform: translateX(-10px); opacity: 0.35; }
  45% { opacity: 0.95; }
  100% { transform: translateX(10px); opacity: 0.45; }
}

@keyframes bridgeFlowBackward {
  0% { transform: translateX(10px); opacity: 0.35; }
  45% { opacity: 0.95; }
  100% { transform: translateX(-10px); opacity: 0.45; }
}

@keyframes interactionGlow {
  0%, 100% { opacity: 0.42; filter: saturate(1); }
  50% { opacity: 0.92; filter: saturate(1.2); }
}

@keyframes codeReveal {
  from { clip-path: inset(0 100% 0 0); opacity: 0.2; }
  to { clip-path: inset(0 0 0 0); opacity: 1; }
}

@keyframes cursorBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

  <script>
(function () {
  const scenes = [...(window.PRESENTATION_SCENES || [])].sort(
    (a, b) => (a.order ?? a.id ?? 0) - (b.order ?? b.id ?? 0)
  );
  const stage = document.getElementById('presentationStage');
  const sceneList = document.getElementById('sceneList');
  const currentIndexEl = document.getElementById('currentIndex');
  const totalCountEl = document.getElementById('totalCount');
  const progressBar = document.getElementById('progressBar');
  const chapterProgressEl = document.getElementById('chapterProgress');
  const previewViewport = document.getElementById('previewViewport');
  const stageScale = document.getElementById('stageScale');
  const controlShell = document.querySelector('.control-shell');
  const exportAllBtn = document.getElementById('exportAllBtn');
  const exportStatusEl = document.getElementById('exportStatus');

  const state = {
    index: 0,
    exporting: false,
  };

  const CHAPTER_META = {
    problem: { key: 'chapter-1', label: 'Chapter 1 · 问题成立', shortLabel: '问题成立' },
    control: { key: 'chapter-2', label: 'Chapter 2 · 主控与执行', shortLabel: '主控与执行' },
    method: { key: 'chapter-3', label: 'Chapter 3 · 比较与方法', shortLabel: '比较与方法' },
    future: { key: 'chapter-4', label: 'Chapter 4 · 改造与未来', shortLabel: '改造与未来' },
  };

  const PAGE_KIND_META = {
    manifest: { key: 'manifest', label: 'Manifest Page', shortLabel: '命题页' },
    evidence: { key: 'evidence', label: 'Evidence Page', shortLabel: '证据页' },
    decision: { key: 'decision', label: 'Decision Page', shortLabel: '选线页' },
    protocol: { key: 'protocol', label: 'Protocol Page', shortLabel: '协议页' },
    method: { key: 'method', label: 'Method Page', shortLabel: '方法页' },
  };

  function getSceneDisplayTag(scene, index = scenes.indexOf(scene)) {
    const numeric = scene.order ?? index + 1;
    return `Page ${String(numeric).padStart(2, '0')}`;
  }

  function getSceneTemplate(scene) {
    return scene.template || inferSceneTemplate(scene);
  }

  function getSceneVariant(scene, template = getSceneTemplate(scene)) {
    return scene.variant || inferSceneVariant(scene, template);
  }

  function getSceneTheme(scene) {
    return scene.theme || inferSceneTheme(scene);
  }

  function getSceneLayout(scene, template = getSceneTemplate(scene)) {
    return scene.layout || inferLayoutFromTemplate(template);
  }

  function setExportStatus(message, tone = 'neutral') {
    if (!exportStatusEl) return;
    exportStatusEl.textContent = message;
    exportStatusEl.dataset.tone = tone;
  }

  function sanitizeFileName(value) {
    return String(value || 'scene')
      .replace(/[\\/:*?"<>|]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 64)
      .replace(/\s/g, '-');
  }

  function buildExportFileName(scene, index) {
    const page = String(index + 1).padStart(2, '0');
    const sceneTag = sanitizeFileName(getSceneDisplayTag(scene, index).toLowerCase());
    const shortTitle = sanitizeFileName(scene.kicker || scene.title || `page-${page}`);
    return `${page}__${sceneTag}__${shortTitle}.png`;
  }

  function wait(ms) {
    return new Promise((resolve) => window.setTimeout(resolve, ms));
  }

  async function waitForStageStable() {
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    await wait(80);
    if (document.fonts?.ready) {
      try {
        await document.fonts.ready;
      } catch (_) {
        // ignore font readiness errors
      }
    }
  }

  async function renderStageBlob(sceneIndex) {
    goTo(sceneIndex);
    await waitForStageStable();
    const exporter = window.htmlToImage;
    if (!exporter?.toBlob) {
      throw new Error('html-to-image 未加载');
    }
    return exporter.toBlob(stage, {
      cacheBust: true,
      pixelRatio: 1,
      canvasWidth: 1920,
      canvasHeight: 1080,
      width: 1920,
      height: 1080,
      backgroundColor: '#edf3f8',
    });
  }

  async function saveBlobWithPicker(fileName, blob, directoryHandle) {
    const fileHandle = await directoryHandle.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
  }

  function saveBlobWithDownload(fileName, blob) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function exportAllScenes() {
    if (state.exporting) return;
    state.exporting = true;
    const originalIndex = state.index;
    const pickerSupported = typeof window.showDirectoryPicker === 'function';
    let directoryHandle = null;

    try {
      if (exportAllBtn) exportAllBtn.disabled = true;
      document.body.classList.add('is-exporting');
      if (pickerSupported) {
        setExportStatus('请选择导出文件夹…', 'working');
        directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      } else {
        setExportStatus('当前浏览器不支持文件夹选择，将改为逐张下载 PNG。', 'warning');
      }

      for (let i = 0; i < scenes.length; i += 1) {
        const scene = scenes[i];
        const fileName = buildExportFileName(scene, i);
        setExportStatus(`正在导出 ${i + 1} / ${scenes.length}：${getSceneDisplayTag(scene, i)} · ${scene.title}`, 'working');
        const blob = await renderStageBlob(i);
        if (!blob) throw new Error(`导出失败：${getSceneDisplayTag(scene, i)}`);

        if (directoryHandle) {
          await saveBlobWithPicker(fileName, blob, directoryHandle);
        } else {
          saveBlobWithDownload(fileName, blob);
          await wait(120);
        }
      }

      setExportStatus(`导出完成：共 ${scenes.length} 张主舞台 PNG。`, 'success');
    } catch (error) {
      if (error?.name === 'AbortError') {
        setExportStatus('已取消导出。', 'warning');
      } else {
        console.error(error);
        setExportStatus(`导出失败：${error?.message || '未知错误'}`, 'error');
      }
    } finally {
      goTo(originalIndex);
      document.body.classList.remove('is-exporting');
      if (exportAllBtn) exportAllBtn.disabled = false;
      state.exporting = false;
    }
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderInlineText(value) {
    return escapeHtml(value).replace(/\n/g, '<br>');
  }

  function renderSectionCard(section, idx) {
    const points = (section.points || [])
      .map((point) => `<li>${escapeHtml(point)}</li>`)
      .join('');

    return `
      <section class="detail-card glass-clear" data-animate style="--delay: ${380 + idx * 90}ms;">
        <div class="detail-card-label">${escapeHtml(section.label || '要点')}</div>
        <h3>${escapeHtml(section.title || '')}</h3>
        ${section.body ? `<p>${escapeHtml(section.body)}</p>` : ''}
        ${points ? `<ul>${points}</ul>` : ''}
      </section>
    `;
  }

  function buildSections(scene) {
    if (!scene.sections || !scene.sections.length) return '';
    return `<div class="detail-grid">${scene.sections.map(renderSectionCard).join('')}</div>`;
  }

  function buildHeadline(scene, options = {}) {
    const { compact = false, includeQuote = true } = options;
    return `
      <div class="headline-block${compact ? ' headline-block--compact' : ''}">
        <span class="kicker glass-clear" data-animate style="--delay: 80ms;">${scene.kicker}</span>
        <h1 class="slide-title" data-animate style="--delay: 180ms;">${scene.title}</h1>
        <p class="slide-summary" data-animate style="--delay: 320ms;">${scene.summary}</p>
        ${includeQuote && scene.quote ? `<div class="quote-box glass-liquid" data-animate style="--delay: 450ms;">${scene.quote}</div>` : ''}
      </div>
    `;
  }

  function buildMeta(scene, options = {}) {
    const { inline = false } = options;
    return `
      <div class="slide-meta${inline ? ' slide-meta--inline' : ''}">
        <div class="chip-row">
          ${(scene.chips || []).map((chip, idx) => `<span class="chip" data-animate style="--delay: ${560 + idx * 70}ms;">${chip}</span>`).join('')}
        </div>
      </div>
    `;
  }

  function buildFooter(scene) {
    const chapter = getSceneChapter(scene);
    const pageKind = getScenePageKind(scene);

    if (order <= 4) {
      return { key: 'chapter-1', label: 'Chapter 1 · 问题成立', shortLabel: '问题成立' };
    }
    if (order <= 8) {
      return { key: 'chapter-2', label: 'Chapter 2 · 主控与执行', shortLabel: '主控与执行' };
    }
    if (order <= 13) {

    return { key: 'chapter-4', label: 'Chapter 4 · 方法上限与未来展开', shortLabel: '上限与未来' };

    if (typeof scene.pageKind === 'string' && PAGE_KIND_META[scene.pageKind]) {

    if ([1, 3, 4, 17].includes(order)) {

  function attachFitFrame(card, selector) {
    if (card?.dataset?.skipFit === 'true') return card;
    const target = card.querySelector(selector);
    if (!target || target.parentElement?.classList.contains('diagram-fit-content')) return card;

    const frame = document.createElement('div');
    frame.className = 'diagram-fit-frame';
    const content = document.createElement('div');
    content.className = 'diagram-fit-content';
    target.parentNode.insertBefore(frame, target);
    frame.appendChild(content);
    content.appendChild(target);
    card.dataset.fitSelector = selector;
    return card;
  }

  function applyDiagramAutoFit(root = document) {
    const cards = root.querySelectorAll('[data-fit-selector]');
    cards.forEach((card) => {
      const frame = card.querySelector('.diagram-fit-frame');
      const content = card.querySelector('.diagram-fit-content');
      if (!frame || !content || !frame.clientWidth || !frame.clientHeight) return;

      const FIT_MARGIN = 8;
      let SAFE_SCALE = 0.99;
      if (card.classList.contains('visual-card--blueprint')) SAFE_SCALE = 0.97;
      if (card.classList.contains('visual-card--artifact-pipeline')) SAFE_SCALE = 0.99;
      if (card.classList.contains('visual-card--table')) SAFE_SCALE = 0.99;
      if (card.classList.contains('visual-card--risk-matrix')) SAFE_SCALE = 0.99;
      if (card.classList.contains('visual-card--decision')) SAFE_SCALE = 0.98;
      if (card.classList.contains('visual-card--triangle')) SAFE_SCALE = 0.98;
      if (card.classList.contains('visual-card--control-map')) SAFE_SCALE = 0.98;
      const availableWidth = Math.max(frame.clientWidth - FIT_MARGIN * 2, 0);
      const availableHeight = Math.max(frame.clientHeight - FIT_MARGIN * 2, 0);
      if (!availableWidth || !availableHeight) return;

      content.style.transform = 'translate(0px, 0px) scale(1)';
      content.style.width = 'max-content';
      content.style.height = 'auto';

      const naturalWidth = Math.max(content.scrollWidth, content.offsetWidth);
      const naturalHeight = Math.max(content.scrollHeight, content.offsetHeight);
      if (!naturalWidth || !naturalHeight) return;

      const rawScale = Math.min(availableWidth / naturalWidth, availableHeight / naturalHeight, 1);
      const scale = Math.min(rawScale * SAFE_SCALE, 1);
      const offsetX = Math.max((frame.clientWidth - naturalWidth * scale) / 2, 0);
      const offsetY = Math.max((frame.clientHeight - naturalHeight * scale) / 2, 0);

      content.style.width = `${naturalWidth}px`;
      content.style.height = `${naturalHeight}px`;
      content.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    });
  }

  function anchorPoint(node, side, scaleX, scaleY) {
    const x = node.x * scaleX;
    const y = node.y * scaleY;
    const w = node.w * scaleX;
    const h = node.h * scaleY;
    if (side === 'left') return { x, y: y + h / 2 };
    if (side === 'right') return { x: x + w, y: y + h / 2 };
    if (side === 'top') return { x: x + w / 2, y };
    return { x: x + w / 2, y: y + h };
  }

  function buildOrthogonalPath(start, end) {
    const midX = (start.x + end.x) / 2;
    return `M ${start.x} ${start.y} L ${midX} ${start.y} L ${midX} ${end.y} L ${end.x} ${end.y}`;
  }

    const wrap = document.createElement('div');
    wrap.className = 'visual-card visual-card--blueprint';

    const board = document.createElement('div');
    board.className = 'blueprint-board';
    board.dataset.animate = 'true';
    board.style.setProperty('--delay', '240ms');

    const viewWidth = 1000;
    const viewHeight = 640;
    const scaleX = viewWidth / 100;
    const scaleY = viewHeight / 100;
    const nodeMap = new Map((visual.nodes || []).map((node) => [node.id, node]));

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'blueprint-lines');
    svg.setAttribute('viewBox', `0 0 ${viewWidth} ${viewHeight}`);
    svg.innerHTML = `
      <defs>
        <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
          <path d="M 0 0 L 12 6 L 0 12" fill="none" stroke="#5d93ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
        </marker>
      </defs>
    `;

    (visual.edges || []).forEach((edge) => {
      const from = nodeMap.get(edge.from);
      const to = nodeMap.get(edge.to);
      if (!from || !to) return;

      const start = anchorPoint(from, edge.fromSide || 'right', scaleX, scaleY);
      const end = anchorPoint(to, edge.toSide || 'left', scaleX, scaleY);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', buildOrthogonalPath(start, end));
      path.setAttribute('class', 'blueprint-edge');
      if (edge.dashed) path.setAttribute('stroke-dasharray', '10 8');
      svg.appendChild(path);

      if (edge.label) {
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'blueprint-edge-label');
        label.setAttribute('x', String((start.x + end.x) / 2));
        label.setAttribute('y', String((start.y + end.y) / 2 - 10));
        label.textContent = edge.label;
        svg.appendChild(label);
      }
    });

    const nodeLayer = document.createElement('div');
    nodeLayer.className = 'blueprint-node-layer';

    (visual.nodes || []).forEach((node, idx) => {
      const el = document.createElement('div');
      el.className = `blueprint-node blueprint-node--${node.tone || 'soft'}`;

      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      el.style.width = `${node.w}%`;
      el.style.minHeight = `${node.h}%`;
      el.style.setProperty('--tilt', node.tilt || '0deg');
      el.innerHTML = `

        ${node.body ? `<div class="blueprint-node-body">${renderInlineText(node.body)}</div>` : ''}
      `;
      nodeLayer.appendChild(el);
    });

    wrap.innerHTML = `<h3 data-animate style="--delay: 180ms;">${escapeHtml(visual.heading || '结构图')}</h3>`;
    board.appendChild(svg);
    board.appendChild(nodeLayer);
    wrap.appendChild(board);

    if (visual.legend && visual.legend.length) {

      const el = document.createElement('article');
      el.className = `network-node network-node--${node.tone || 'soft'}`;
      el.dataset.animate = 'true';
      el.style.setProperty('--delay', `${280 + idx * 70}ms`);
      el.style.left = `${node.x}%`;
      el.style.top = `${node.y}%`;
      el.innerHTML = `
        <div class="network-node-title">${escapeHtml(node.title || '')}</div>
        ${node.body ? `<p>${escapeHtml(node.body)}</p>` : ''}
      `;
      board.appendChild(el);
      nodeMap.set(node.id, el);
    });

    (visual.links || []).forEach((link, idx) => {
      const from = nodeMap.get(link.from);
      const to = nodeMap.get(link.to);
      if (!from || !to) return;

      const beam = document.createElement('div');
      beam.className = `network-beam network-beam--${link.tone || 'primary'}`;
      beam.dataset.animate = 'true';
      beam.style.setProperty('--delay', `${420 + idx * 80}ms`);

      const startX = (link.fromX ?? 0);
      const startY = (link.fromY ?? 0);
      const endX = (link.toX ?? 0);
      const endY = (link.toY ?? 0);

      const dx = endX - startX;
      const dy = endY - startY;
      const length = Math.max(Math.hypot(dx, dy), 12);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      beam.style.left = `${startX}%`;
      beam.style.top = `${startY}%`;
      beam.style.width = `${length}%`;
      beam.style.transform = `rotate(${angle}deg)`;

      if (link.label) {
        const label = document.createElement('span');
        label.className = 'network-beam-label';
        label.textContent = link.label;
        beam.appendChild(label);
      }

      const pulse = document.createElement('i');
      pulse.className = 'network-beam-pulse';
      beam.appendChild(pulse);
      links.appendChild(beam);
    });

    if (visual.legend?.length) {
      const legend = document.createElement('div');
      legend.className = 'network-legend';
      visual.legend.forEach((item, idx) => {
        const pill = document.createElement('span');
        pill.className = 'network-legend-pill';
        pill.dataset.animate = 'true';
        pill.style.setProperty('--delay', `${700 + idx * 60}ms`);
        pill.textContent = item;
        legend.appendChild(pill);
      });
      wrap.appendChild(legend);
    }

    return attachFitFrame(wrap, '.network-mesh-board');
  }

  function createChatWorkflowVisual(visual) {
    const baseScenario = {
      label: visual.defaultScenarioLabel || '默认流程',
      inputHint: visual.inputHint || '输入下一轮任务约束…',
      returnNote: visual.returnNote || '回传到主控：diff / logs / result / next_step',
      bridgeForward: visual.bridgeForward || 'handoff task card',
      bridgeBack: visual.bridgeBack || 'return diff / log',
      userPrompt: visual.userPrompt || '请继续推进下一轮分析，先给输入、方法和产物路径。',
      autoReply: visual.autoReply || '收到。我会先校验输入，再执行并固定回传结果。',
      dispatchCommand: visual.dispatchCommand || 'opencode run --ticket "next-step" --return-artifacts',
      messages: visual.messages || [],
      commands: visual.commands || [],
    };

    const scenarios = Array.isArray(visual.scenarios) && visual.scenarios.length
      ? visual.scenarios.map((scenario, idx) => ({
          ...baseScenario,
          ...scenario,
          label: scenario.label || `流程 ${idx + 1}`,
          messages: scenario.messages || baseScenario.messages,
          commands: scenario.commands || baseScenario.commands,
        }))
      : [baseScenario];

    const wrap = document.createElement('div');
    wrap.className = 'visual-card visual-card--chat-workflow';
    const tabs = scenarios.length > 1
      ? `
      <div class="workflow-scenario-tabs" data-animate style="--delay: 120ms;">
        ${scenarios
          .map((scenario, idx) => `<button class="workflow-scenario-btn${idx === 0 ? ' is-active' : ''}" type="button" data-scenario-index="${idx}">${escapeHtml(scenario.label || `流程 ${idx + 1}`)}</button>`)
          .join('')}
      </div>`
      : '';

    wrap.innerHTML = `
      ${tabs}
      <div class="chat-workflow-board" data-animate style="--delay: 180ms;">
        <section class="chat-workflow-pane chat-workflow-pane--chat glass-frosted">
          <div class="chat-workflow-pane-title">${escapeHtml(visual.chatTitle || 'User ↔ Lobster / OpenClaw')}</div>
          <div class="chat-thread"></div>
          <div class="chat-input-bar">
            <span class="chat-input-placeholder"></span>
            <button class="chat-send" type="button">Send</button>
          </div>
        </section>
        <div class="chat-workflow-bridge" aria-hidden="true">
          <span class="chat-workflow-bridge-pill"></span>
          <span class="chat-workflow-bridge-arrow">→</span>
          <span class="chat-workflow-bridge-pill chat-workflow-bridge-pill--back"></span>
        </div>
        <section class="chat-workflow-pane chat-workflow-pane--terminal glass-clear">
          <div class="chat-workflow-pane-title">${escapeHtml(visual.terminalTitle || 'OpenCode Terminal')}</div>
          <div class="terminal-stream"></div>
          <div class="terminal-return"></div>
        </section>
      </div>
    `;

    const thread = wrap.querySelector('.chat-thread');
    const stream = wrap.querySelector('.terminal-stream');
    const inputPlaceholder = wrap.querySelector('.chat-input-placeholder');
    const returnNote = wrap.querySelector('.terminal-return');
    const bridgeForward = wrap.querySelector('.chat-workflow-bridge-pill');
    const bridgeBack = wrap.querySelector('.chat-workflow-bridge-pill--back');
    const sendButton = wrap.querySelector('.chat-send');
    const stagedTimers = new Set();
    let renderToken = 0;

    function clearStagedTimers() {
      stagedTimers.forEach((timerId) => window.clearTimeout(timerId));
      stagedTimers.clear();
    }

    function scheduleStage(fn, delayMs) {
      const timerId = window.setTimeout(() => {
        stagedTimers.delete(timerId);
        fn();
      }, delayMs);
      stagedTimers.add(timerId);
    }

    function appendMessage(msg, idx) {
      const row = document.createElement('article');
      row.className = `chat-msg chat-msg--${msg.role || 'lobster'}`;
      if (typeof idx === 'number') {
        row.dataset.animate = 'true';
        row.style.setProperty('--delay', `${260 + idx * 120}ms`);
      }
      row.innerHTML = `
        <div class="chat-msg-role">${escapeHtml(msg.roleLabel || '')}</div>
        <div class="chat-msg-body">${escapeHtml(msg.text || '')}</div>
      `;
      thread.appendChild(row);
    }

    function appendCommand(line, idx) {
      const row = document.createElement('div');
      row.className = `terminal-stream-line terminal-stream-line--${line.kind || 'log'}`;
      if (typeof idx === 'number') {
        row.dataset.animate = 'true';
        row.style.setProperty('--delay', `${360 + idx * 100}ms`);
      }
      row.innerHTML = `
        <span class="terminal-stream-prefix">${escapeHtml(line.prefix || '')}</span>
        <span class="terminal-stream-text">${escapeHtml(line.text || '')}</span>
      `;
      stream.appendChild(row);
    }

    function renderScenario(index, options = {}) {
      const { staged = true } = options;
      const active = scenarios[index] || scenarios[0];
      renderToken += 1;
      const currentToken = renderToken;
      clearStagedTimers();
      thread.innerHTML = '';
      stream.innerHTML = '';
      inputPlaceholder.textContent = active.inputHint || baseScenario.inputHint;
      returnNote.textContent = active.returnNote || baseScenario.returnNote;
      bridgeForward.textContent = active.bridgeForward || baseScenario.bridgeForward;
      bridgeBack.textContent = active.bridgeBack || baseScenario.bridgeBack;
      sendButton.dataset.sent = '0';
      sendButton.disabled = false;

      const messages = active.messages || [];
      const commands = active.commands || [];

      if (!staged) {
        messages.forEach((msg, idx) => appendMessage(msg, idx));
        commands.forEach((line, idx) => appendCommand(line, idx));
      } else {
        const messageStepMs = Number(active.messageStepMs || 720);
        const commandStepMs = Number(active.commandStepMs || 680);
        let timelineMs = 140;

        messages.forEach((msg) => {
          scheduleStage(() => {
            if (currentToken !== renderToken) return;
            appendMessage(msg);
            thread.scrollTop = thread.scrollHeight;
          }, timelineMs);
          timelineMs += messageStepMs;
        });

        timelineMs += 260;

        commands.forEach((line) => {
          scheduleStage(() => {
            if (currentToken !== renderToken) return;
            appendCommand(line);
            stream.scrollTop = stream.scrollHeight;
          }, timelineMs);
          timelineMs += commandStepMs;
        });
      }

      wrap.querySelectorAll('.workflow-scenario-btn').forEach((btn, btnIdx) => {
        btn.classList.toggle('is-active', btnIdx === index);
      });
    }

    wrap.querySelectorAll('.workflow-scenario-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const nextIndex = Number(btn.dataset.scenarioIndex || 0);
        renderScenario(nextIndex, { staged: true });
      });
    });

    sendButton.addEventListener('click', () => {
      if (sendButton.dataset.sent === '1') return;
      renderToken += 1;
      const currentToken = renderToken;
      clearStagedTimers();
      const activeIndex = Number(wrap.querySelector('.workflow-scenario-btn.is-active')?.dataset.scenarioIndex || 0);
      const active = scenarios[activeIndex] || scenarios[0];
      sendButton.dataset.sent = '1';
      sendButton.disabled = true;

      scheduleStage(() => {
        if (currentToken !== renderToken) return;
        appendMessage({ role: 'user', roleLabel: 'User', text: active.userPrompt || baseScenario.userPrompt });
        thread.scrollTop = thread.scrollHeight;
      }, 200);

      scheduleStage(() => {
        if (currentToken !== renderToken) return;
        appendMessage({ role: 'lobster', roleLabel: 'Lobster', text: active.autoReply || baseScenario.autoReply });
        thread.scrollTop = thread.scrollHeight;
      }, 1120);

      scheduleStage(() => {
        if (currentToken !== renderToken) return;
        appendCommand({ kind: 'cmd', prefix: 'PS>', text: active.dispatchCommand || baseScenario.dispatchCommand });
        stream.scrollTop = stream.scrollHeight;
      }, 2040);
    });

    renderScenario(0, { staged: true });

    return wrap;
  }

        </div>
        <div class="slide-compare-main glass-frosted slide-compare-main--handoff-focus">
          ${buildSections(scene)}
        </div>
        <div class="slide-compare-side glass-clear slide-compare-side--handoff-focus"></div>
        ${buildFooter(scene)}
      `;
      slide.querySelector('.slide-compare-side').appendChild(createVisual(scene));
      return slide;
    }

    if (template === 'protocol-map') {
      slide.innerHTML = `
        ${buildStageChrome(scene)}
        <div class="slide-header glass-frosted slide-header--protocol-map">
          ${buildHeadline(scene, { compact: true, includeQuote: false })}
          <div class="header-side header-side--protocol-map">
            ${scene.quote ? `<div class="quote-box glass-liquid quote-box--protocol-map" data-animate style="--delay: 420ms;">${scene.quote}</div>` : ''}
            ${buildMeta(scene, { inline: true })}
          </div>
        </div>
        <div class="slide-protocol-left glass-frosted slide-protocol-left--protocol-map"></div>
        <div class="slide-protocol-right glass-clear slide-protocol-right--protocol-map">
          ${buildSections(scene)}
        </div>
        ${buildFooter(scene)}
      `;
      slide.querySelector('.slide-protocol-left').appendChild(createVisual(scene));
      return slide;
    }

    if (template === 'matrix-brief') {
      slide.innerHTML = `
        ${buildStageChrome(scene)}
        <div class="slide-header glass-frosted slide-header--matrix-brief">
          ${buildHeadline(scene, { compact: true, includeQuote: false })}
          <div class="header-side header-side--matrix-brief">
            ${scene.quote ? `<div class="quote-box glass-liquid quote-box--matrix-brief" data-animate style="--delay: 420ms;">${scene.quote}</div>` : ''}
            ${buildMeta(scene, { inline: true })}
          </div>
        </div>
        <div class="slide-compare-main glass-frosted slide-compare-main--matrix-brief">
          ${buildSections(scene)}
        </div>
        <div class="slide-compare-side glass-clear slide-compare-side--matrix-brief"></div>
        ${buildFooter(scene)}
      `;
      slide.querySelector('.slide-compare-side').appendChild(createVisual(scene));
      return slide;
    }

    if (layout === 'board') {
      slide.innerHTML = `
        ${buildStageChrome(scene)}
        <div class="slide-header glass-frosted">
          ${buildHeadline(scene, { compact: true, includeQuote: false })}
          <div class="header-side">
            ${scene.quote ? `<div class="quote-box glass-liquid" data-animate style="--delay: 430ms;">${scene.quote}</div>` : ''}
            ${buildMeta(scene, { inline: true })}
          </div>
        </div>
        <div class="slide-board glass-frosted"></div>
        <div class="slide-foot glass-clear">
          ${buildSectionRail(scene)}
        </div>
        ${buildFooter(scene)}
      `;
      slide.querySelector('.slide-board').appendChild(createVisual(scene));
      return slide;
    }

    if (layout === 'comparison') {
      if (variant === 'hero-right') {
        slide.innerHTML = `
          ${buildStageChrome(scene)}
          <div class="slide-header glass-frosted slide-header--hero-compare">
            ${buildHeadline(scene, { compact: false, includeQuote: false })}
            <div class="header-side header-side--hero-compare">
              ${scene.quote ? `<div class="quote-box glass-liquid quote-box--hero-compare" data-animate style="--delay: 420ms;">${scene.quote}</div>` : ''}
              ${buildMeta(scene, { inline: true })}
            </div>
          </div>
          <div class="slide-compare-main glass-frosted slide-compare-main--hero-compare">
            ${buildSections(scene)}
          </div>
          <div class="slide-compare-side glass-clear slide-compare-side--hero-compare"></div>
          ${buildFooter(scene)}
        `;
        slide.querySelector('.slide-compare-side').appendChild(createVisual(scene));
        return slide;
      }

      slide.innerHTML = `
        ${buildStageChrome(scene)}
        <div class="slide-header glass-frosted">
          ${buildHeadline(scene, { compact: true, includeQuote: true })}
          ${buildMeta(scene)}
        </div>
        <div class="slide-compare-main glass-frosted">
          ${buildSections(scene)}
        </div>
        <div class="slide-compare-side glass-clear"></div>
        ${buildFooter(scene)}
      `;
      slide.querySelector('.slide-compare-side').appendChild(createVisual(scene));
      return slide;
    }

    if (layout === 'editorial') {
      if (variant === 'hero-stack-top') {
        slide.innerHTML = `
          ${buildStageChrome(scene)}
          <div class="slide-top-split slide-top-split--hero-stack">
            <div class="hero-stack-copy-panel glass-frosted">
              <div class="hero-stack-copy">
                <span class="kicker glass-clear" data-animate style="--delay: 80ms;">${scene.kicker}</span>
                <h1 class="slide-title" data-animate style="--delay: 180ms;">${scene.title}</h1>
                <p class="slide-summary" data-animate style="--delay: 320ms;">${scene.summary}</p>
              </div>
              ${scene.quote ? `<div class="quote-box glass-liquid quote-box--hero-stack" data-animate style="--delay: 420ms;">${scene.quote}</div>` : ''}
            </div>
            <div class="hero-stack-aside-panel glass-clear">
              <div class="hero-stack-aside">
                <div class="hero-stack-capsules" data-animate style="--delay: 300ms;">
                  ${(scene.chips || []).map((chip) => `<span class="chip">${chip}</span>`).join('')}
                </div>
                <div class="hero-stack-spot glass-clear" data-animate style="--delay: 500ms;"></div>
              </div>
            </div>
          </div>
          <div class="slide-editorial-bottom slide-editorial-bottom--hero-stack">
            <div class="slide-editorial-sections glass-frosted slide-editorial-sections--hero-stack">
              ${buildSections(scene)}
            </div>
            <div class="slide-editorial-visual glass-clear slide-editorial-visual--hero-stack"></div>
          </div>
          ${buildFooter(scene)}
        `;
        slide.querySelector('.slide-editorial-visual').appendChild(createVisual(scene));
        return slide;
      }

      slide.innerHTML = `
        ${buildStageChrome(scene)}
        <div class="slide-header glass-frosted">
          ${buildHeadline(scene, { compact: false, includeQuote: true })}
          ${buildMeta(scene, { inline: true })}
        </div>
        <div class="slide-editorial-bottom">
          <div class="slide-editorial-sections glass-frosted">
            ${buildSections(scene)}
          </div>
          <div class="slide-editorial-visual glass-clear"></div>
        </div>
        ${buildFooter(scene)}
      `;
      slide.querySelector('.slide-editorial-visual').appendChild(createVisual(scene));
      return slide;
    }

    if (layout === 'protocol') {
      slide.innerHTML = `
        ${buildStageChrome(scene)}
        <div class="slide-header glass-frosted">
          ${buildHeadline(scene, { compact: true, includeQuote: false })}
          <div class="header-side">
            ${scene.quote ? `<div class="quote-box glass-liquid" data-animate style="--delay: 420ms;">${scene.quote}</div>` : ''}
            ${buildMeta(scene, { inline: true })}
          </div>
        </div>
        <div class="slide-protocol-left glass-frosted"></div>
        <div class="slide-protocol-right glass-clear">
          ${buildSections(scene)}
        </div>
        ${buildFooter(scene)}
      `;
      slide.querySelector('.slide-protocol-left').appendChild(createVisual(scene));
      return slide;
    }

    slide.innerHTML = `
      ${buildStageChrome(scene)}
      <div class="slide-main glass-frosted">
        ${buildHeadline(scene, { includeQuote: true })}
        ${buildSections(scene)}
        ${buildMeta(scene)}
      </div>
      <div class="slide-side"></div>
      ${buildFooter(scene)}
    `;
    slide.querySelector('.slide-side').appendChild(createVisual(scene));
    return slide;
  }

  function updateSidePanel(scene) {
    currentIndexEl.textContent = String(state.index + 1);
    progressBar.style.width = `${((state.index + 1) / scenes.length) * 100}%`;
  }

  function renderChapterProgress() {
    if (!chapterProgressEl) return;
    const chapterMap = new Map();
    scenes.forEach((scene, idx) => {
      const chapter = getSceneChapter(scene);
      if (!chapterMap.has(chapter.key)) {
        chapterMap.set(chapter.key, {
          ...chapter,
          start: idx + 1,
          end: idx + 1,
          count: 1,
        });
      } else {
        const current = chapterMap.get(chapter.key);
        current.end = idx + 1;
        current.count += 1;
      }
    });

    chapterProgressEl.innerHTML = [...chapterMap.values()]
      .map((chapter) => `
        <button class="chapter-pill" type="button" data-chapter-key="${chapter.key}" data-page-start="${chapter.start - 1}">
          <strong>${chapter.shortLabel}</strong>
          <span>${String(chapter.start).padStart(2, '0')}–${String(chapter.end).padStart(2, '0')}</span>
        </button>
      `)
      .join('');

    chapterProgressEl.querySelectorAll('.chapter-pill').forEach((button) => {
      button.addEventListener('click', () => {
        const pageStart = Number(button.dataset.pageStart || 0);
        goTo(pageStart);
      });
    });
  }

  function renderSceneList() {
    sceneList.innerHTML = '';
    scenes.forEach((scene, idx) => {
      const chapter = getSceneChapter(scene);
      const pageKind = getScenePageKind(scene);
      const btn = document.createElement('button');
      btn.className = 'scene-link';
      btn.dataset.chapter = chapter.key;
      btn.innerHTML = `
        <div class="scene-link-top">
          <strong>${getSceneDisplayTag(scene, idx)}</strong>
          <em>${pageKind.shortLabel}</em>
        </div>
        <span>${scene.title}</span>
        <small>${chapter.shortLabel}</small>
      `;
      btn.addEventListener('click', (event) => {
        event.currentTarget.blur();
        goTo(idx);
      });
      sceneList.appendChild(btn);
    });
  }

  function syncSceneList() {
    [...sceneList.children].forEach((node, idx) => {
      node.classList.toggle('is-active', idx === state.index);
      if (idx === state.index && sceneList.clientHeight > 0) {
        node.scrollIntoView({ block: 'nearest' });
      }
    });

    if (chapterProgressEl) {
      const currentChapter = getSceneChapter(scenes[state.index]);
      [...chapterProgressEl.children].forEach((node) => {
        node.classList.toggle('is-active', node.dataset.chapterKey === currentChapter.key);
      });
    }
  }

  function restartAnimation() {
    const slide = stage.querySelector('.slide');
    if (!slide) return;
    slide.classList.remove('is-animating');
    window.requestAnimationFrame(() => {
      window.requestAnimationFrame(() => {
        slide.classList.add('is-animating');
      });
    });
  }

  function render() {
    const scene = scenes[state.index];
    stage.innerHTML = '';
    const slide = renderSlide(scene);
    stage.appendChild(slide);
    updateSidePanel(scene);
    if (controlShell) controlShell.scrollTop = 0;
    syncSceneList();
    restartAnimation();
    window.requestAnimationFrame(() => {
      window.requestAnimationFrame(() => {
        applyDiagramAutoFit(stage);
        window.setTimeout(() => resizeStage(), 160);
      });
    });
  }

  function goTo(index) {
    if (index < 0 || index >= scenes.length) return;
    state.index = index;
    render();
  }

  function resizeStage() {
    syncViewportMetrics();
    const viewportStyles = getComputedStyle(previewViewport);
    const paddingX = parseFloat(viewportStyles.paddingLeft) + parseFloat(viewportStyles.paddingRight);
    const paddingY = parseFloat(viewportStyles.paddingTop) + parseFloat(viewportStyles.paddingBottom);
    const availableWidth = previewViewport.clientWidth - paddingX;
    const availableHeight = previewViewport.clientHeight - paddingY;
    const scale = Math.min(availableWidth / 1920, availableHeight / 1080);
    const safeScale = Math.max(scale, 0.1);
    const offsetX = Math.max((availableWidth - 1920 * safeScale) / 2, 0);
    const offsetY = Math.max((availableHeight - 1080 * safeScale) / 2, 0);
    stageScale.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${safeScale})`;
    applyDiagramAutoFit(stage);
  }

  document.getElementById('prevBtn').addEventListener('click', () => goTo(state.index - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(state.index + 1));
  document.getElementById('restartBtn').addEventListener('click', restartAnimation);
  if (exportAllBtn) {
    exportAllBtn.addEventListener('click', exportAllScenes);
  }

  window.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight') goTo(state.index + 1);
    if (event.key === 'ArrowLeft') goTo(state.index - 1);
    if (event.key === 'Home') goTo(0);
    if (event.key === 'End') goTo(scenes.length - 1);
    if (event.key.toLowerCase() === 'r') restartAnimation();
  });

  const observer = new ResizeObserver(resizeStage);
  observer.observe(previewViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeStage);
    window.visualViewport.addEventListener('scroll', resizeStage);
  }

  renderSceneList();
  renderChapterProgress();
  syncViewportMetrics();
  setExportStatus(`选择文件夹后，将按当前 ${scenes.length} 页顺序导出 1920×1080 主舞台图片。`);
  render();
  resizeStage();
})();

</script>
</body>
</html>
